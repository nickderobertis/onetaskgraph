[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.19"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/nickderobertis/onetaskgraph"
authors = ["Nick DeRobertis"]

[workspace.dependencies]
onetaskgraph-plugin-api = { path = "crates/onetaskgraph-plugin-api", version = "0.2.19" }
onetaskgraph-core = { path = "crates/onetaskgraph-core", version = "0.2.19" }
onetaskgraph-in-memory = { path = "crates/onetaskgraph-in-memory", version = "0.2.19" }
onetaskgraph-local-md = { path = "crates/onetaskgraph-local-md", version = "0.2.19" }
onetaskgraph-linear = { path = "crates/onetaskgraph-linear", version = "0.2.19" }
onetaskgraph-github-projects = { path = "crates/onetaskgraph-github-projects", version = "0.2.19" }

async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4.6.6", features = ["derive"] }
# Default features off: the resolvers fetch `$ref`s over HTTP and off the filesystem, and
# every schema validated here is one a plugin handed over in memory. A validator that
# could reach the network would be a way for work data to leave the process.
jsonschema = { version = "0.50.1", default-features = false }
graphql-parser = "0.4.1"
schemars = { version = "1.2.2", features = ["chrono04"] }
secrecy = "0.10.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "native-tls-vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# A maintained fork of serde_yaml, which was archived. Nothing else in reach parses YAML
# into serde types with the error positions a configuration message needs.
serde_norway = "0.9.42"
serde_path_to_error = "0.1.20"
thiserror = "2.0.20"
# `sync` and `time` are for the engine's own concurrency test: it holds two sources at a
# rendezvous, which only completes if they were consulted at once, under a timeout so a
# sequential engine fails the test rather than hanging the suite.
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.24.0"

[profile.release]
strip = true

# Test/dev builds dominate the gate's wall clock; a little optimisation on the
# dependency graph costs nothing after the first build and speeds every run.
[profile.dev.package."*"]
opt-level = 1
