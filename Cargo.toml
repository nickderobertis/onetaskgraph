[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.12.13"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/nickderobertis/onetaskgraph"
authors = ["Nick DeRobertis"]

[workspace.dependencies]
# Every sibling is required exactly. These pre-1.0 crates are released in lock step and are
# not compatible across patches — an exhaustive match or a struct literal in one is written
# against the others' exact release — so a caret would let a consumer resolve one against
# another's newer patch and compile nothing. release-plz rewrites these in step, keeping the
# `=`; scripts/set-version.sh --check refuses one without it, and the release job refuses to
# publish a crate whose siblings resolve elsewhere (scripts/crate-sibling-resolution.sh).
onetaskgraph-plugin-api = { path = "crates/onetaskgraph-plugin-api", version = "=0.12.13" }
onetaskgraph-core = { path = "crates/onetaskgraph-core", version = "=0.12.13" }
onetaskgraph-in-memory = { path = "crates/onetaskgraph-in-memory", version = "=0.12.13" }
onetaskgraph-local-md = { path = "crates/onetaskgraph-local-md", version = "=0.12.13" }
onetaskgraph-linear = { path = "crates/onetaskgraph-linear", version = "=0.12.13" }
onetaskgraph-github-projects = { path = "crates/onetaskgraph-github-projects", version = "=0.12.13" }
onetaskgraph-status-options = { path = "crates/onetaskgraph-status-options", version = "=0.12.13" }
# The workspace's own test-support crate: the gate every live session opens. Path-only
# and unpublished on purpose — cargo strips a path-only dev-dependency when it packages
# the crates that name it, so nothing a consumer installs can reach it.
onetaskgraph-live = { path = "crates/onetaskgraph-live" }
# The GitHub Projects lane's own names, read by its tests and the scheduled janitor.
# Path-only and unpublished for the reason `onetaskgraph-live` is.
onetaskgraph-github-live = { path = "crates/onetaskgraph-github-live" }
# The harness every binary end-to-end suite shares — the sandbox, the binary runner, the
# loopback servers and the journey-matrix table. Path-only and unpublished for the reason
# `onetaskgraph-live` is: only the test-only e2e members name it.
onetaskgraph-e2e-support = { path = "crates/onetaskgraph-e2e-support" }

url = "2.5.8"
async-trait = "0.1.92"
# An asset's bytes over the stdio plugin protocol. Already in this lockfile through reqwest, so
# naming it adds no crate to the closure.
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4.6.6", features = ["derive"] }
# The binary's per-variable template prompts. Only the binary crate may name it: nothing below
# the command line prompts. Default features off — the editor and password prompts are not
# used, and they would add a temporary-file and a zeroising dependency for nothing.
dialoguer = { version = "0.12.0", default-features = false }
# Default features off: the resolvers fetch `$ref`s over HTTP and off the filesystem, and
# every schema validated here is one a plugin handed over in memory. A validator that
# could reach the network would be a way for work data to leave the process.
jsonschema = { version = "0.50.1", default-features = false }
graphql-parser = "0.4.1"
# The task-template renderer. A caret on 2.24 rather than an exact pin: the host that renders
# these templates beside this engine already builds minijinja 2.24, and one compatible 2.x
# requirement keeps a build holding both to one copy. The features beyond the defaults are
# what "full minijinja" means for a template author: a loader so `extends`, `include` and
# `import` resolve over a search path, `break`/`continue`, and the `tojson` and `urlencode`
# filters.
minijinja = { version = "2.24.0", features = ["loader", "loop_controls", "json", "urlencode"] }
# GitHub's published node-count rules, as a pure offline calculation over a GraphQL
# document's own text. It is depended on rather than reimplemented: the number that
# decides whether GitHub will execute a query at all is one arithmetic, and a second
# spelling of it here would be a second answer nobody reconciles.
github-graphql-node-count = "0.0.1"
# The reporter of the Linear request budgets' runner (`crates/onetaskgraph-linear-e2e`). Exact,
# because it is the release of the `onebudgetspec` package.json pins to judge it; that crate's
# tests/e2e/budget_commands.rs fails when the two pins part.
onebudgetspec-core = "=0.1.5"
# Which image syntax in a content is inside code, and so is no asset reference: CommonMark's
# code spans and code blocks, read by a parser rather than restated. No earlier floor than
# 0.13.5: every 0.13 release before it is RUSTSEC-2026-0414, and a published crate's
# requirement is what a consumer resolves.
pulldown-cmark = { version = "0.13.5", default-features = false }
# The Linear budgets' runner checks a budget id against onebudgetspec's own exported pattern.
regex = "1.13.1"
schemars = { version = "1.2.2", features = ["chrono04"] }
secrecy = "0.10.3"
# A template's digest: `sha256:` over every file of its chain.
sha2 = "0.10.9"
uuid = { version = "1", default-features = false, features = ["std", "v4", "v5"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "native-tls-vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Every YAML read and write: safe Rust, with the error positions a configuration message
# needs. The serde_yaml family runs on a machine translation of libyaml into unsafe Rust
# (RUSTSEC-2024-0449), which `deny.toml` bans.
serde-saphyr = "1.3"
serde_path_to_error = "0.1.20"
thiserror = "2.0.20"
# Windows alone leaves a deleted file listed in its folder while another process still
# holds a handle to it, refusing every open of it with *access is denied* — which is the
# same answer a file this reader may not have. `NtOpenFile` is what tells the two apart,
# and it is what the local Markdown source's read path decides a vanished file on. Already
# resolved at this version in this lockfile through tempfile, tokio and rustix, so naming
# it adds no crate to the closure and no second version for `deny` to refuse.
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
# `sync` and `time` are for the engine's own concurrency test: it holds two sources at a
# rendezvous, which only completes if they were consulted at once, under a timeout so a
# sequential engine fails the test rather than hanging the suite.
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

assert_cmd = "2.2.2"
# The prompting journeys' pseudo-terminal: already in this lockfile through tempfile, so
# naming it adds no crate, only the `pty` module of one that is here.
rustix = "1.1.4"
# The CPU time of a child process the store start-up harness waited for, which `std` does not
# report. Already in this lockfile through tokio and others, so naming it adds no crate.
libc = "0.2.189"
predicates = "3.1.4"
tempfile = "3.24.0"

[profile.release]
strip = true

# Test/dev builds dominate the gate's wall clock; a little optimisation on the
# dependency graph costs nothing after the first build and speeds every run.
[profile.dev.package."*"]
opt-level = 1
