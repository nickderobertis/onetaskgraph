[project]
name = "spike-gaps"
version = "0.0.0"
description = "The board-copy-gaps feasibility spike: live probes, synthetic reachability and screening cases, and their analysis."
requires-python = ">=3.13"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["gaps"]
known-third-party = ["proxy", "quota", "sanitize", "workload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../harness"]

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["../harness"]
