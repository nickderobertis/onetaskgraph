# The spike-gaps harness runs on the host's Python 3.13, the floor `ty.toml` declares too.
target-version = "py313"
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["gaps", "tests"]
known-third-party = ["quota", "sanitize", "workload"]
