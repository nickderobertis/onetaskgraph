  # The budget report: the released action's own job, on every pull request and every push to main,
  # keeping one standing comment. On a pull request each row takes what test-linux and lint saved
  # and reports, or says none was found; on a push to main each takes the merged pull request's
  # figure, so no test job runs there. Budgets labelled not-measured-on-pr have no row, one line
  # counts them, and their checks elsewhere are unchanged. The full history lets local git prove
  # each saved base commit's ancestry, and the group serializes comment writers. .github/reporting
  # holds its budget and the journeys that drive it.
  budgets:
    needs: [lint, test-linux, test-windows, test-macos]
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: budget-report-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nickderobertis/onebudgetspec-github-action@v0.3.0
        with:
          token: ${{ github.token }}
          enforcement-exclude-labels: release-tail,report-only
          omit-labels: not-measured-on-pr
          saved-results-artifacts: budget-check-results-*
