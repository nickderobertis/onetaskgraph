# Prove the workspace from a clean checkout, on the real platform matrix.
#
# A pull request runs the gate over the projects its diff can actually reach; the default
# branch sweeps every project, so nothing affected-detection or a stale cache could miss
# goes unchecked. Both go through the same `just` recipes a contributor runs locally.
#
# **The tests that reach a real API run here, in the ordinary `check` job, and nowhere
# else.** There is no live workflow, no live job and no live target: change the GitHub
# Projects plugin and its GitHub tests run in this required check and can fail it; change
# the Linear plugin and its Linear tests do; change the engine or another plugin and
# neither runs, because affected selection does not select them. That reverses an earlier
# decision and AGENTS.md records why.
#
# **One live session per run of this workflow**, which is two arrangements rather than one:
# only the `ubuntu-latest` leg of the matrix below is given the credentials, and
# scripts/rust-coverage.sh clears them before `cargo llvm-cov` re-runs the same integration
# tests inside the same `just check`. Change either and read the note in that script first.
#
# **A fork pull request receives no secrets, and takes the skip path**: the credentials
# arrive empty, the live tests print why they are skipping, and `ONETASKGRAPH_LIVE_REQUIRED`
# is `0` there so that skip is not turned into a failure. Everywhere else it is `1`, so the
# lane cannot pass green merely because a credential went missing.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the token is read-only by default and widened per job only where a job
# genuinely needs more.
permissions:
  contents: read

jobs:
  install-path:
    name: install path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
      - name: Prove the recommended installer and launcher
        shell: bash
        run: just distribution-test

  # The three required OS lanes. All three are required because this ships a
  # cross-platform command-line tool whose install path CI has to prove on the real
  # matrix; affected selection is what keeps that affordable.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base is derived explicitly below; a shallow checkout cannot resolve it.
          fetch-depth: 0

      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # v7 is the newest floating major tag this action publishes: its releases run on to
      # v10.0.1, but it stopped moving a major tag after v7, so v8, v9 and v10 resolve to
      # nothing.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Reads rust-toolchain.toml, so CI and local compile with byte-identical rustc,
      # clippy and rustfmt, and the version is pinned in exactly one place.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # cargo-deny is not only the `deny` job's tool: `just check` runs
      # check-isolation-enforced.sh, whose fifth case asserts cargo-deny refuses a
      # dev-dependency edge to the engine, so without it here that guard cannot run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-machete,cargo-deny

      - name: Bootstrap
        run: just bootstrap

      # Derive the base explicitly rather than letting Nx guess: an implicit base is how
      # affected selection quietly starts comparing against the wrong commit.
      - name: Derive the merge base
        id: base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ]; then
            git fetch --no-tags origin "$BASE_REF"
            merge_base="$(git merge-base "$BASE_SHA" HEAD)"
            echo "base=$merge_base" >> "$GITHUB_OUTPUT"
            echo "Affected against the merge base with $BASE_REF: $merge_base"
          fi

      - name: Check the affected projects
        if: github.event_name == 'pull_request' && matrix.os != 'ubuntu-latest'
        env:
          # Nx's own mechanism for "compare against this commit". Setting it here rather
          # than threading an argument through every recipe keeps one source of truth for
          # the base across all five phases of the gate.
          NX_BASE: ${{ steps.base.outputs.base }}
          NX_HEAD: HEAD
        run: just check

      # Generated-code drift is platform-independent. The Linux aggregate adds its
      # uniform Nx target without paying for the generator in the other required lanes.
      - name: Check the affected projects and generated Python SDK
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          # The one place a live session's credentials and nominations enter this build.
          # They are on the two ubuntu-latest steps alone: `just check` runs `test` and
          # `coverage`, and coverage re-runs the same integration tests, so a second lane
          # carrying these would open a second session against the same shared fixture.
          #
          # GH_PROJECTS_TOKEN, not GITHUB_PROJECTS_TOKEN: GitHub Actions refuses to create
          # any secret whose name begins with GITHUB_, so the short name is the one that
          # can exist in both CI and the local secrets file — and a single name is
          # preferred over a translation. Do not "correct" this into a break.
          GH_PROJECTS_TOKEN: ${{ secrets.GH_PROJECTS_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # The board the GitHub Projects lane writes to, named here rather than discovered.
          # It refuses to pick a board itself — "whichever project was updated most recently"
          # once walked a credentialed write lane onto the board plans are authored on — so
          # without every name below it skips. They are not secret: they are the fixture
          # board this lane's own items live on, and naming them in the open is what makes
          # the blast radius reviewable.
          # llmlint: ignore[contracts_have_one_source_or_a_drift_gate] The lane's own refusal is the drift gate: ONETASKGRAPH_LIVE_REQUIRED below is 1 on this lane, so a name spelled differently on either side fails this required check naming the variable rather than skipping green.
          GH_PROJECTS_OWNER: nickderobertis
          GH_PROJECTS_NUMBER: "1"
          # A project is an issue and a task is its sub-issue, so this lane's artifact is a
          # real issue and a board has no repository to create one in. Named for the same
          # reason the board is: a credentialed write must not land somewhere nobody chose.
          GH_PROJECTS_REPOSITORY: nickderobertis/onetaskgraph
          # The Linear lane's own nomination, the same rule one level over: a scratch team
          # it may write its fixture to, rather than one it discovered. A repository
          # variable rather than a secret, because a team key is a nomination and reviewing
          # where a write lane may land needs it readable.
          LINEAR_WRITE_TEAM: ${{ vars.LINEAR_WRITE_TEAM }}
          # A fork pull request is given no secrets, so its live tests skip with a reason
          # and that skip is honest. Every other run is one where a credential is expected,
          # and there an absent credential or nomination fails rather than passing green.
          # llmlint: ignore[live_tier_compiles_and_requires_credential] The `0` here is the fork case alone, which is the one run where no credential was ever expected: GitHub supplies a fork pull request no secrets at all, so demanding one would fail every outside contribution for something the contributor cannot supply. Every other run — including every pull request from this repository, which is the one the merge waits on — gets `1`, and there an absent credential fails rather than skipping green. That is the demand this rule asks for, expressed once at the only place credentials enter this build.
          ONETASKGRAPH_LIVE_REQUIRED: ${{ github.event.pull_request.head.repo.fork && '0' || '1' }}
          NX_BASE: ${{ steps.base.outputs.base }}
          NX_HEAD: HEAD
        # llmlint: ignore[external_service_suite_stays_out_of_the_affected_tier] This repository deliberately reversed that rule; AGENTS.md records it under "The tests that reach a real API are ordinary tests, and that reverses an earlier decision". Holding them outside the required set is what let a query GitHub refuses outright merge — the advisory lane went red on the pull request that introduced it and auto-merge squashed it anyway, because auto-merge waits only on required checks. Affected selection is what keeps the cost bounded: these targets run only when their own plugin changed, and `scripts/check-live-lane.sh` asserts the whole shape.
        run: just check-generated

      # On the default branch, sweep everything. A cache is for speed and must never be
      # what makes a broken clean build look green.
      - name: Sweep every project
        if: github.event_name != 'pull_request' && matrix.os != 'ubuntu-latest'
        run: just gate


      - name: Sweep every project and check generated Python SDK
        if: github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          # The default-branch half of the pull-request step above, and everything about
          # why is written there rather than twice: why each name is spelled as it is, why
          # the board and the scratch team are nominated rather than discovered, and why
          # these are on one lane of the matrix alone.
          GH_PROJECTS_TOKEN: ${{ secrets.GH_PROJECTS_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # llmlint: ignore[contracts_have_one_source_or_a_drift_gate] As on that step: the lane's own refusal is the drift gate, because ONETASKGRAPH_LIVE_REQUIRED is 1 here too, so a name spelled differently on either side fails this run naming the variable rather than skipping green.
          GH_PROJECTS_OWNER: nickderobertis
          GH_PROJECTS_NUMBER: "1"
          GH_PROJECTS_REPOSITORY: nickderobertis/onetaskgraph
          LINEAR_WRITE_TEAM: ${{ vars.LINEAR_WRITE_TEAM }}
          # Demanded unconditionally, which the step above cannot be: this one runs on a
          # push to the default branch, and a push is never a fork pull request, so there is
          # no run here where a credential was not expected.
          ONETASKGRAPH_LIVE_REQUIRED: "1"
        run: just gate-generated

  # Supply chain, Linux-only: the graph is the same on every platform, so running it three
  # times would buy nothing. This is where the two mechanically-enforced invariants fail —
  # the banned-store list and the onetaskgraph-core wrapper restriction. See deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - name: Supply-chain gate
        run: just deny

  # The PR title becomes the one squash commit that lands and that release-plz reads, so a
  # malformed title must not merge.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The LLM-judge tier, separate from `check` because it is non-deterministic, needs an
  # authenticated harness and makes network calls. Scoped to the files this PR changed, so
  # a PR pays for its own changes rather than a full-repo sweep.
  llmlint:
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch main (diff base)
        run: git fetch --no-tags --depth=2147483647 origin main
      - uses: extractions/setup-just@v4
      # setup-llmlint.sh installs llmlint with `uv tool install` and tolerates every
      # failure, so with no uv on PATH it logs "uv not found", exits 0, and the job only
      # discovers llmlint is missing at the validate step below.
      - uses: astral-sh/setup-uv@v7

      - name: Install oneharness + llmlint
        run: |
          just setup-llmlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # setup-llmlint.sh installs llmlint and oneharness but NOT a harness, so without
      # this the lint step would skip every file and still pass.
      - name: Install the coding harness (claude-code)
        run: npm i -g @anthropic-ai/claude-code

      # Deterministic and model-free, so it runs first and fails a config, suppression or
      # version-bump slip in milliseconds rather than after a paid harness call.
      - name: Validate the llmlint config (no model)
        run: just lint-llm-validate --diff-base origin/main

      - name: Lint the changed files
        env:
          # `claude` reads only CLAUDE_CODE_OAUTH_TOKEN, so the same secret exported
          # under any other name leaves it unauthenticated and surfaces as a misleading
          # oneharness parse error rather than a missing credential.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Fail with an actionable message rather than an opaque harness error — and
          # never no-op to green, which would report unlinted files as clean.
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::llmlint needs a harness credential. Add the" \
                 "CLAUDE_CODE_OAUTH_TOKEN repository secret (it is declared in" \
                 "gh-secrets.json). Fork pull requests are gated by the" \
                 "require-approval-for-fork-workflows setting." >&2
            exit 1
          fi
          just lint-llm-diff origin/main
