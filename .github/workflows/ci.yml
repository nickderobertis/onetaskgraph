# Prove the workspace from a clean checkout, on the real platform matrix.
#
# Every lane runs the same `just` recipes a contributor runs locally, over the projects its
# diff can reach, and derives its base explicitly below rather than letting Nx guess one —
# the default branch included, where a sweep once ran every plugin's live tests for a
# release commit and exhausted the account's GraphQL budget. AGENTS.md records that.
#
# Two things about the tests that reach a real API are this file's alone. One live session
# per run: only one Linux lane carries the credentials — `test-linux` on a pull request, the
# `ubuntu-latest` leg of `check` on a push — and scripts/rust-coverage.sh
# clears them before coverage re-runs the same tests — read the note there before changing
# either. And `ONETASKGRAPH_LIVE_REQUIRED` travels with them rather than with the matrix: `1`
# on that leg, `0` there on a fork pull request alone, so the leg that was handed a credential
# never passes green for one that went missing. The other two legs run the same tests with
# neither and skip them, which is what one session per run costs; the leg that does run them
# is required for the merge exactly as they are.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Run the combined macOS diagnostic proofs
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the token is read-only by default and widened per job only where a job
# genuinely needs more.
permissions:
  contents: read

jobs:
  macos-lanes:
    name: macOS lanes
    runs-on: ubuntu-latest
    outputs:
      macosRequired: ${{ steps.select.outputs.macosRequired }}
      reason: ${{ steps.select.outputs.reason }}
      diagnostic: ${{ github.event_name == 'workflow_dispatch' && inputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - uses: extractions/setup-just@v4
      - run: just github-workflows-bootstrap
      - name: Classify the semantic release diff
        id: select
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/macos-policy.mjs classify --event "$GITHUB_EVENT_PATH" --base "$BASE" --head "$HEAD"

  install-path:
    name: install path (${{ matrix.os }})
    needs: [macos-lanes]
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      # `just distribution-test` now delegates to the scripts project's Nx target of that
      # name, and scripts/nx.sh runs the locked install when a checkout has never had one —
      # which needs bun. Without this step the recipe stops at "bun is not installed"
      # before the journey it drives.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@v7
      - name: Prove the recommended installer and launcher
        shell: bash
        run: just distribution-test

  # The Linux and Windows required lanes; macOS runs in the one combined job below and
  # reaches `check (macos-latest)` through its carrier. All three are required because this
  # ships a cross-platform command-line tool whose install path CI has to prove on the real
  # matrix; affected selection is what keeps that affordable.
  check:
    name: check (${{ matrix.os }})
    needs: [macos-lanes]
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base is derived explicitly below; a shallow checkout cannot resolve it.
          fetch-depth: 0

      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # v7 is the newest floating major tag this action publishes: its releases run on to
      # v10.0.1, but it stopped moving a major tag after v7, so v8, v9 and v10 resolve to
      # nothing.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Reads rust-toolchain.toml, so CI and local compile with byte-identical rustc,
      # clippy and rustfmt, and the version is pinned in exactly one place.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # cargo-deny is not only the `deny` job's tool: `just check` runs
      # check-isolation-enforced.sh, whose fifth case asserts cargo-deny refuses a
      # dev-dependency edge to the engine, so without it here that guard cannot run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-machete,cargo-deny

      - name: Bootstrap
        run: just bootstrap

      # Derive the base explicitly rather than letting Nx guess: an implicit base is how
      # affected selection quietly starts comparing against the wrong commit. On the
      # default branch that is not a stylistic preference — `defaultBase` is origin/main,
      # which on a push to main IS this commit, so an implicit base would select nothing at
      # all. `github.event.before` is the commit this push replaced, and it is all-zeros on
      # a branch the remote has never seen, so HEAD~1 is the fallback.
      - name: Derive the comparison base
        id: base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ -n "${BASE_SHA:-}" ]; then
            git fetch --no-tags origin "$BASE_REF"
            merge_base="$(git merge-base "$BASE_SHA" HEAD)"
            echo "base=$merge_base" >> "$GITHUB_OUTPUT"
            echo "Affected against the merge base with $BASE_REF: $merge_base"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "$zero" ] \
            && git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null; then
            echo "base=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
            echo "Affected against the commit this push replaced: $BEFORE_SHA"
          elif git rev-parse --verify --quiet 'HEAD~1^{commit}' >/dev/null; then
            fallback="$(git rev-parse HEAD~1)"
            echo "base=$fallback" >> "$GITHUB_OUTPUT"
            echo "Affected against HEAD~1, this push having no readable predecessor: $fallback"
          else
            echo "No base could be derived; Nx will fall back to its own defaultBase."
          fi

      # llmlint: ignore[live_tier_compiles_and_requires_credential] This leg is given no credential, for the reason the file header states, so it cannot demand one.
      - name: Check the affected projects
        if: github.event_name == 'pull_request' && matrix.os != 'ubuntu-latest'
        env:
          # Nx's own mechanism for "compare against this commit". Setting it here rather
          # than threading an argument through every recipe keeps one source of truth for
          # the base across all five phases of the gate.
          NX_BASE: ${{ steps.base.outputs.base }}
          NX_HEAD: HEAD
        run: just check

      # Generated-code drift is platform-independent. The Linux aggregate adds its
      # uniform Nx target without paying for the generator in the other required lanes.
      # One live session per run: on a pull request `test-linux` carries the credentials,
      # so this leg runs uncredentialed and its live journeys skip. The default-branch step
      # below keeps them, because `test-linux` never runs on a push.
      # llmlint: ignore[live_tier_compiles_and_requires_credential] This step is given no credential, because test-linux carries this run's one live session, so it cannot demand one.
      - name: Check the affected projects and generated Python SDK
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          NX_BASE: ${{ steps.base.outputs.base }}
          NX_HEAD: HEAD
        # llmlint: ignore[external_service_suite_stays_out_of_the_affected_tier] These targets run only when their own plugin changed, which is the edge; AGENTS.md records why an edge of their own was removed.
        run: just check-generated

      # The release pull request alone, after the gate above passed: the pass-time budget of
      # the pool maintenance onevcs.toml declares. Its measurement builds the workspace twice,
      # so no per-change path runs it (pool-maintenance/project.json). The pinned pruner it
      # runs is already installed by the Bootstrap step above, as on every leg.
      - name: Pool-maintenance pass-time budget on the release pull request
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && startsWith(github.head_ref, 'release-plz-')
        run: just pool-maintenance-budget

      # On the default branch, the same gate against the commit this push replaced. A cache
      # is for speed and must never be what makes a broken clean build look green, which is
      # why `just gate` keeps the supply-chain and distribution stages outside selection.
      # llmlint: ignore[live_tier_compiles_and_requires_credential] This leg is given no credential, for the reason the file header states, so it cannot demand one.
      - name: Check the affected projects on the default branch
        if: github.event_name != 'pull_request' && matrix.os != 'ubuntu-latest'
        env:
          NX_BASE: ${{ steps.base.outputs.base }}
          NX_HEAD: HEAD
        run: just gate


      - name: Check the affected projects and generated Python SDK on the default branch
        if: github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          # The default-branch half of the pull-request step above; why is written there.
          GH_PROJECTS_TOKEN: ${{ secrets.GH_PROJECTS_TOKEN }}
          GITHUB_LIVE_SESSION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_LIVE_SESSION_DIR: ${{ github.workspace }}/target/debug/telemetry/github-live-session/${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_LIVE_SOURCE_REVISION: ${{ github.sha }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # llmlint: ignore[contracts_have_one_source_or_a_drift_gate] As on that step: the lane's own refusal is the drift gate, because ONETASKGRAPH_LIVE_REQUIRED is 1 here too, so a name spelled differently on either side fails this run naming the variable rather than skipping green.
          GH_PROJECTS_OWNER: nickderobertis
          GH_PROJECTS_NUMBER: "1"
          GH_PROJECTS_REPOSITORY: nickderobertis/onetaskgraph-live-scratch
          LINEAR_WRITE_TEAM: ${{ vars.LINEAR_WRITE_TEAM }}
          # Demanded unconditionally, which the step above cannot be: this one runs on a
          # push to the default branch, and a push is never a fork pull request, so there is
          # no run here where a credential was not expected.
          ONETASKGRAPH_LIVE_REQUIRED: "1"
          NX_BASE: ${{ steps.base.outputs.base }}
          NX_HEAD: HEAD
        run: just gate-generated

  # The explicit manual diagnostic alone. On a pull request the one Mac job is `test-macos`,
  # which the two carriers below read in this job's place.
  macos:
    name: macOS check and install proofs
    needs: [macos-lanes]
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base is derived explicitly below; a shallow checkout cannot resolve it.
          fetch-depth: 0

      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # v7 is the newest floating major tag this action publishes: its releases run on to
      # v10.0.1, but it stopped moving a major tag after v7, so v8, v9 and v10 resolve to
      # nothing.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Reads rust-toolchain.toml, so CI and local compile with byte-identical rustc,
      # clippy and rustfmt, and the version is pinned in exactly one place.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # cargo-deny is not only the `deny` job's tool: `just check` runs
      # check-isolation-enforced.sh, whose fifth case asserts cargo-deny refuses a
      # dev-dependency edge to the engine, so without it here that guard cannot run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-machete,cargo-deny

      - name: Bootstrap
        run: just bootstrap

      # Use the PR merge base for the same affected selection as the Linux/Windows lanes.
      - name: Derive the comparison base
        id: macos-base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ -n "${BASE_SHA:-}" ]; then
            git fetch --no-tags origin "$BASE_REF"
            merge_base="$(git merge-base "$BASE_SHA" HEAD)"
            echo "base=$merge_base" >> "$GITHUB_OUTPUT"
            echo "Affected against the merge base with $BASE_REF: $merge_base"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "$zero" ] \
            && git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null; then
            echo "base=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
            echo "Affected against the commit this push replaced: $BEFORE_SHA"
          elif git rev-parse --verify --quiet 'HEAD~1^{commit}' >/dev/null; then
            fallback="$(git rev-parse HEAD~1)"
            echo "base=$fallback" >> "$GITHUB_OUTPUT"
            echo "Affected against HEAD~1, this push having no readable predecessor: $fallback"
          else
            echo "No base could be derived; Nx will fall back to its own defaultBase."
          fi

      # llmlint: ignore-block[live_tier_compiles_and_requires_credential,no_second_broader_sweep_over_an_already_gated_commit] The Linux lane alone carries live credentials; this Mac proof runs without them exactly as before. The task explicitly permits an opted-in manual diagnostic rerun outside the automatic lifecycle.
      - name: Check the affected projects
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          # Nx's own mechanism for "compare against this commit". Setting it here rather
          # than threading an argument through every recipe keeps one source of truth for
          # the base across all five phases of the gate.
          NX_BASE: ${{ steps.macos-base.outputs.base }}
          NX_HEAD: HEAD
        # just check includes distribution-test, preserving the former install-path proof once.
        run: just check
      # llmlint: ignore-end[live_tier_compiles_and_requires_credential,no_second_broader_sweep_over_an_already_gated_commit]

  macos-check:
    name: check (macos-latest)
    needs: [macos-lanes, macos, test-macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Report the required macOS proof outcome
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > needs.json
          node .github/macos-result.mjs needs.json

  macos-install:
    name: install path (macos-latest)
    needs: [macos-lanes, macos, test-macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Report the required macOS proof outcome
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > needs.json
          node .github/macos-result.mjs needs.json

  # Supply chain, Linux-only: the graph is the same on every platform, so running it three
  # times would buy nothing. This is where the two mechanically-enforced invariants fail —
  # the banned-store list and the onetaskgraph-core wrapper restriction. See deny.toml.
  deny:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - name: Supply-chain gate
        run: just deny

  # The PR title becomes the one squash commit that lands and that release-plz reads, so a
  # malformed title must not merge.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The LLM-judge tier, separate from `check` because it is non-deterministic, needs an
  # authenticated harness and makes network calls. Scoped to the files this PR changed, so
  # a PR pays for its own changes rather than a full-repo sweep.
  llmlint:
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch main (diff base)
        run: git fetch --no-tags --depth=2147483647 origin main
      - uses: extractions/setup-just@v4
      # setup-llmlint.sh installs llmlint with `uv tool install` and tolerates every
      # failure, so with no uv on PATH it logs "uv not found", exits 0, and the job only
      # discovers llmlint is missing at the validate step below.
      - uses: astral-sh/setup-uv@v7

      - name: Install oneharness + llmlint
        run: |
          just setup-llmlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # setup-llmlint.sh installs llmlint and oneharness but NOT a harness, so without
      # this the lint step would skip every file and still pass.
      - name: Install the coding harness (claude-code)
        run: npm i -g @anthropic-ai/claude-code

      # Deterministic and model-free, so it runs first and fails a config, suppression or
      # version-bump slip in milliseconds rather than after a paid harness call.
      - name: Validate the llmlint config (no model)
        run: just lint-llm-validate --diff-base origin/main

      - name: Lint the changed files
        env:
          # `claude` reads only CLAUDE_CODE_OAUTH_TOKEN, so the same secret exported
          # under any other name leaves it unauthenticated and surfaces as a misleading
          # oneharness parse error rather than a missing credential.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Fail with an actionable message rather than an opaque harness error — and
          # never no-op to green, which would report unlinted files as clean.
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::llmlint needs a harness credential. Add the" \
                 "CLAUDE_CODE_OAUTH_TOKEN repository secret (it is declared in" \
                 "gh-secrets.json). Fork pull requests are gated by the" \
                 "require-approval-for-fork-workflows setting." >&2
            exit 1
          fi
          just lint-llm-diff origin/main

  # ---------------------------------------------------------------------------------------
  # The four pull-request jobs: `lint` once, on Linux, for everything platform-independent,
  # and one test job per platform. None needs another, so all four start at once, and each
  # runs its checks through one `just ci-<job>` recipe (scripts/ci-job.sh) over the projects
  # the diff reaches. The jobs above stay until branch protection names these four.

  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # llmlint: ignore-block[least_privilege_grants] The visual docs steps push the pull
    # request's gallery preview to gh-pages, upsert its before/after comment and gate on the
    # Pages build; notignored upserts its sticky comment. No other step is handed the token:
    # the checkout persists no credential.
    permissions:
      contents: write # push the gh-pages gallery preview
      pull-requests: write # the visual docs and notignored sticky comments; read the PR title
      pages: read # gate on the Pages build the deploy triggers
    # llmlint: ignore-end[least_privilege_grants]
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base, llmlint's diff and notignored's scan all need the full history.
          fetch-depth: 0
          persist-credentials: false
      # The capture builds the release binary inside the Rust image matching
      # rust-toolchain.toml, exactly as visual-docs.yml's capture-command does, and runs
      # beside the checks below rather than after them. Its `target` is a directory of its
      # own, so the host's restored build cache and its builds never meet the container's;
      # it runs as root there, and hands what it wrote in the tree back before exiting.
      # llmlint: ignore-block[work_goes_through_command_surface] These are the two lines
      # visual-docs.yml's capture-command runs, inside the same plain Rust image with no
      # `just` on it; the recipes `just screenshots-tools` and `just screenshots` wrap them.
      - name: Start the visual docs capture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/capture/target"
          nohup bash -c '
            docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP/capture/target:/w/target" -w /w \
              rust:1.97.1-bookworm bash -c "
                status=0
                { bash scripts/screenshots-freeze.sh ensure &&
                  SHOTS_OUT=shots/current/x86_64 bash scripts/screenshots.sh &&
                  SHOTS_OUT=shots/verify/x86_64 bash scripts/screenshots.sh; } || status=\$?
                chown -R $(id -u):$(id -g) shots docs/screenshots
                exit \$status"
            echo $? > "$RUNNER_TEMP/capture/exit"' > "$RUNNER_TEMP/capture/log" 2>&1 < /dev/null &
      # llmlint: ignore-end[work_goes_through_command_surface]
      - name: Check the pull request title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A fork's pull request is granted a read-only token, so the comment upsert would fail
      # on something the contributor has no way to fix (notignored.yml).
      - name: Comment the suppressions this change adds
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: nickderobertis/notignored@v0
      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Reads rust-toolchain.toml; its built-in cache keys `target` and the cargo registry on
      # Cargo.lock, the toolchain and the OS, and cargo's fingerprints refuse a stale unit.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # cargo-binstall is what makes scripts/scoped-release-plz.sh download release-plz rather
      # than build it from source, which was most of a cold Bootstrap.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-machete,cargo-deny,cargo-binstall
      - name: Read the pinned bootstrap tool versions
        id: pins
        shell: bash
        run: bash scripts/ci-tool-pins.sh
      # Each cache is keyed on everything that produced it, so a hit is never stale: the tool
      # caches on the pinned version, the OS and the architecture (and the pruner, which cargo
      # builds, on the toolchain); the Nx cache on every lockfile and the toolchain, whose
      # entries Nx itself serves only for an unchanged input hash.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/onetaskgraph/tools/release-plz
          key: release-plz-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.release-plz }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-prune-superseded
            ~/.cargo/bin/cargo-prune-superseded.exe
          key: prune-superseded-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.prune-superseded }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'bun.lock', 'uv.lock', 'sdks/python/uv.lock', '.github/bun.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: nx-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'bun.lock', 'uv.lock', 'sdks/python/uv.lock', '.github/bun.lock', 'rust-toolchain.toml') }}-
      - name: Bootstrap
        run: just bootstrap
      - name: Derive the comparison base
        id: pr-base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-pr-base.sh "$BASE_REF" "$BASE_SHA"
      - name: Format, lint and type-check the affected projects, generated code and the supply chain
        env:
          NX_BASE: ${{ steps.pr-base.outputs.base }}
          NX_HEAD: HEAD
        run: just ci-lint
      - name: Install oneharness and llmlint
        run: |
          just setup-llmlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # setup-llmlint.sh installs no harness, so without this the lint would skip every file.
      - name: Install the coding harness (claude-code)
        run: npm i -g @anthropic-ai/claude-code
      - name: Validate the llmlint config (no model)
        run: just lint-llm-validate --diff-base origin/main
      - name: Lint the changed files with llmlint
        env:
          # `claude` reads only CLAUDE_CODE_OAUTH_TOKEN; see the llmlint job above.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::llmlint needs a harness credential. Add the" \
                 "CLAUDE_CODE_OAUTH_TOKEN repository secret (it is declared in" \
                 "gh-secrets.json). Fork pull requests are gated by the" \
                 "require-approval-for-fork-workflows setting." >&2
            exit 1
          fi
          just lint-llm-diff origin/main
      - name: Wait for the visual docs capture
        shell: bash
        run: |
          until [ -f "$RUNNER_TEMP/capture/exit" ]; do sleep 5; done
          status="$(cat "$RUNNER_TEMP/capture/exit")"
          if [ "$status" != 0 ]; then
            cat "$RUNNER_TEMP/capture/log" >&2
            echo "::error::the visual docs capture exited $status; its log is above. Reproduce it with 'just screenshots'." >&2
            exit 1
          fi
      # screencomp's own composite actions, as steps of this job rather than its reusable
      # workflow, which would add five jobs: the same CLI pin and inputs visual-docs.yml
      # passes, one lane (`x86_64`, screencomp.toml), the strict drift gate.
      - uses: nickderobertis/screencomp@v0.4.8
        with:
          version: v0.4.8
      - uses: nickderobertis/screencomp/visual-docs@v0.4.8
        with:
          arch: x86_64
          current: shots/current
          verify-second: shots/verify
          gallery-title: Visual docs
          fail-on-drift: true
          publish: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          comment-mode: aggregated
          pages-artifact: screencomp-gallery-x86_64
          github-token: ${{ github.token }}
      - uses: nickderobertis/screencomp/visual-docs-pages@v0.4.8
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          github-token: ${{ github.token }}
      - uses: nickderobertis/screencomp/visual-docs-aggregate@v0.4.8
        with:
          matrix: '[{"project":"","arch":"x86_64","current":"shots/current","verify":"shots/verify","manifest":"","gallery_title":"Visual docs"}]'
          publish: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          github-token: ${{ github.token }}


  test-linux:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base, the release shortcut and main's history all need the full history.
          fetch-depth: 0
          persist-credentials: false
      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The release shortcut reads semantic-json.mjs, which is this private tooling's.
      - name: Install the workflow tooling
        run: just github-workflows-bootstrap
      # On release-plz's release pull request alone the tests are not run a second time: the
      # tree under test is a tree main already passed plus nothing but version and changelog
      # edits. The script decides from that tree comparison and nothing else; `lint` never
      # consults it.
      - name: Decide whether the release shortcut applies
        id: release
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --quiet --no-tags origin "$DEFAULT_BRANCH"
          node .github/release-shortcut.mjs decide --base "$BASE_SHA" --head HEAD --main "origin/$DEFAULT_BRANCH"
      - name: Report the release shortcut
        if: steps.release.outputs.tests == 'skip'
        shell: bash
        env:
          REASON: ${{ steps.release.outputs.reason }}
        run: echo "Tests not run ($REASON); the lint job still runs in full."
      - uses: astral-sh/setup-uv@v7
        if: steps.release.outputs.tests == 'run'
        with:
          enable-cache: true
      # Reads rust-toolchain.toml; its built-in cache keys `target` and the cargo registry on
      # Cargo.lock, the toolchain and the OS, and cargo's fingerprints refuse a stale unit.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.release.outputs.tests == 'run'
      # cargo-binstall is what makes scripts/scoped-release-plz.sh download release-plz rather
      # than build it from source, which was most of a cold Bootstrap.
      - uses: taiki-e/install-action@v2
        if: steps.release.outputs.tests == 'run'
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-machete,cargo-deny,cargo-binstall
      - name: Read the pinned bootstrap tool versions
        id: pins
        if: steps.release.outputs.tests == 'run'
        shell: bash
        run: bash scripts/ci-tool-pins.sh
      # Each cache is keyed on everything that produced it, so a hit is never stale: the tool
      # caches on the pinned version, the OS and the architecture (and the pruner, which cargo
      # builds, on the toolchain); the Nx cache on every lockfile and the toolchain, whose
      # entries Nx itself serves only for an unchanged input hash.
      - uses: actions/cache@v6
        if: steps.release.outputs.tests == 'run'
        with:
          path: ~/.cache/onetaskgraph/tools/release-plz
          key: release-plz-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.release-plz }}
      - uses: actions/cache@v6
        if: steps.release.outputs.tests == 'run'
        with:
          path: |
            ~/.cargo/bin/cargo-prune-superseded
            ~/.cargo/bin/cargo-prune-superseded.exe
          key: prune-superseded-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.prune-superseded }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: actions/cache@v6
        if: steps.release.outputs.tests == 'run'
        with:
          path: .nx/cache
          key: nx-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'bun.lock', 'uv.lock', 'sdks/python/uv.lock', '.github/bun.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: nx-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'bun.lock', 'uv.lock', 'sdks/python/uv.lock', '.github/bun.lock', 'rust-toolchain.toml') }}-
      - name: Bootstrap
        if: steps.release.outputs.tests == 'run'
        run: just bootstrap
      - name: Derive the comparison base
        id: pr-base
        if: steps.release.outputs.tests == 'run'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-pr-base.sh "$BASE_REF" "$BASE_SHA"
      - name: Test the affected projects
        if: steps.release.outputs.tests == 'run'
        env:
          # This run's one live session. GH_PROJECTS_TOKEN rather than GITHUB_PROJECTS_TOKEN,
          # which GitHub refuses as a secret name; nominations in the open, because a lane
          # writes only where it is pointed and refuses to pick a target itself.
          GH_PROJECTS_TOKEN: ${{ secrets.GH_PROJECTS_TOKEN }}
          GITHUB_LIVE_SESSION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_LIVE_SESSION_DIR: ${{ github.workspace }}/target/debug/telemetry/github-live-session/${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_LIVE_SOURCE_REVISION: ${{ github.sha }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # llmlint: ignore[contracts_have_one_source_or_a_drift_gate] The lane's own refusal is the drift gate: ONETASKGRAPH_LIVE_REQUIRED below is 1 on this lane, so a name spelled differently on either side fails this job naming the variable rather than skipping green.
          GH_PROJECTS_OWNER: nickderobertis
          GH_PROJECTS_NUMBER: "1"
          GH_PROJECTS_REPOSITORY: nickderobertis/onetaskgraph-live-scratch
          LINEAR_WRITE_TEAM: ${{ vars.LINEAR_WRITE_TEAM }}
          # llmlint: ignore[live_tier_compiles_and_requires_credential] `0` on a fork pull request alone, which GitHub hands no secrets; every other run demands the credential, as on `check`'s Linux leg.
          ONETASKGRAPH_LIVE_REQUIRED: ${{ github.event.pull_request.head.repo.fork && '0' || '1' }}
          NX_BASE: ${{ steps.pr-base.outputs.base }}
          NX_HEAD: HEAD
        run: just ci-test-linux


