name: Release-plz
on:
  push:
    branches: [main, "cache-promote/**"]
permissions: {}
jobs:
  # The first step is the guard: without both tokens a fork or an unconfigured clone does
  # nothing, and every later step reads its answer.
  # .github/tests/release-plz.test.mjs drives these steps over a scratch repository.
  release-plz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # llmlint: ignore-block[least_privilege_grants] Main-push release operations need both writes. A cache-promote push requires repository push access and runs its own branch workflow, so these grants give its author nothing they could not grant themselves. GitHub permissions cannot vary by event inside this existing job; the task forbids adding a job, and every release operation is main-push-only. Cache promotion makes only read-only REST calls and writes cache data through the runner runtime token.
      contents: write
      pull-requests: write
      # llmlint: ignore-end[least_privilege_grants]
      actions: read
    concurrency:
      group: release-plz
      cancel-in-progress: false
    steps:
      - id: guard
        name: Decide whether this repository can release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: echo "enabled=$([ -n "$RELEASE_TOKEN" ] && [ -n "$CARGO_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
      - name: Decide cache trust and configure the sidecar
        id: nx-cache-trust
        shell: bash
        run: |
          node scripts/nx-remote-cache.mjs trust
          token="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: op-nx/github-cache/start-cache-server@91839c24885842cac86567c30e23b37fb85f7e33
        id: nx-cache
        background: true
        with:
          port: '3000'
        env:
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:3000
          NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ steps.nx-cache-trust.outputs.token }}
          CACHE_READ_ONLY: ${{ steps.nx-cache-trust.outputs.read_only == 'true' && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Wait for the cache recording proxy
        shell: bash
        env:
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:3000
          NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ steps.nx-cache-trust.outputs.token }}
        run: node scripts/nx-remote-cache.mjs ready
      - name: Promote the pull request's cache entries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            pr="${GITHUB_REF_NAME##*/}"
            node scripts/nx-remote-cache.mjs promote --pr "$pr" --workflow ci.yml
          else
            node scripts/nx-remote-cache.mjs promote --sha "$GITHUB_SHA" --workflow ci.yml
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nx-cache-promotion-${{ github.sha }}
          path: ${{ runner.temp }}/nx-cache-promotion
          retention-days: 7
      - cancel: nx-cache
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true'
      # scripts/prepare-release-pr.sh runs scripts/set-version.sh, which relocks the Python
      # side; without uv on PATH the release pull request could not carry a uv.lock that
      # agrees with the version it proposes. v7 is the newest floating major tag this action
      # publishes.
      - name: Read the pinned bootstrap tool versions
        id: pins
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true'
        shell: bash
        run: bash scripts/ci-tool-pins.sh
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ steps.pins.outputs.uv }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true'
      # cargo-binstall rather than release-plz itself: the pinned release-plz is provisioned
      # by scripts/scoped-release-plz.sh into the repository-scoped tool location every
      # script of this repository resolves it from — the same provisioning `just bootstrap`
      # does on a host, and with cargo-binstall on PATH a download of the published binary
      # rather than a build. The pin is that script's RELEASE_PLZ_VERSION, in one place,
      # because scripts/check-release-pr-sync.sh stands in for the tool in the gate and a
      # stand-in models one version's behaviour: that check reconciles the pin against the
      # version it was recorded from and fails when they part, so moving the pin means
      # re-observing the real tool rather than hoping it still behaves the same.
      - uses: taiki-e/install-action@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true'
        with:
          tool: cargo-semver-checks,cargo-binstall@${{ steps.pins.outputs.cargo-binstall }}
      - name: Provision the pinned release-plz into the repository-scoped tool location
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true'
        env:
          # cargo-binstall fetches the binary from release-plz's own GitHub Releases, and an
          # anonymous fetch from a shared runner address is what its rate limit refuses.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/scoped-release-plz.sh ensure
      # llmlint: ignore-block[changed_behavior_has_e2e] .github/tests/release-plz.test.mjs drives each run step below over a scratch repository and a GitHub double; what is left is GitHub itself creating the tag, the release and the merge, which a pre-publication dispatch cannot perform.
      - name: Tag and cut the GitHub Release with the PAT
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/scoped-release-plz.sh run release --git-token "$GITHUB_TOKEN"
      # Not `release-plz release-pr`: that writes the Cargo manifests and nothing else, so
      # the pull request it opens carries npm/, sdks/ and pyproject.toml at the previous
      # version and fails the `check` its own merge requires. The script bumps with
      # release-plz, brings every other manifest to the version it chose, and only then opens
      # the pull request. GIT_TOKEN rather than an argument: release-plz reads the token from
      # there, and an argument list is readable by every process on the runner.
      - name: Open or update the release pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true'
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: scripts/prepare-release-pr.sh
      # The release pull request merges itself once its required checks pass: auto-merge,
      # never a merge, and for release-plz's own pull request and no other.
      - name: Enable auto-merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: python3 scripts/enable-release-automerge.py
      # llmlint: ignore-end[changed_behavior_has_e2e]
