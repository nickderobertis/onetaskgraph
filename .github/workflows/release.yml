name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
# llmlint: ignore-block[changed_behavior_has_e2e] Proving these jobs requires publishing a GitHub Release and registry packages, which a pre-publication dispatch cannot perform.
jobs:
  native-assets-and-carriers:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz, npm: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz, npm: linux-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: tar.gz, npm: darwin-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz, npm: darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip, npm: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { target: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target "${{ matrix.target }}" -p onetaskgraph
        env: { RUSTFLAGS: "-D warnings" }
      - name: Archive, checksum, and attach
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          NPM_PLATFORM: ${{ matrix.npm }}
        run: |
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' || { echo "invalid release tag: $TAG" >&2; exit 64; }
          name="onetaskgraph-${TAG}-${TARGET}"; bin="target/${TARGET}/release/onetaskgraph"
          [ "$EXT" != zip ] || bin="${bin}.exe"
          if [ "$EXT" = zip ]; then 7z a "${name}.zip" "$bin"; else tar -czf "${name}.tar.gz" -C "$(dirname "$bin")" "$(basename "$bin")"; fi
          asset="${name}.${EXT}"
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          gh release upload "$TAG" "$asset" "$asset.sha256"
          mkdir -p "carrier/bin" "dist/carriers"
          cp "npm/platforms/${NPM_PLATFORM}/package.json" carrier/package.json
          cp "$bin" "carrier/bin/$(basename "$bin")"
          npm pack ./carrier --pack-destination dist/carriers
      - uses: actions/upload-artifact@v4
        with: { name: "carrier-${{ matrix.npm }}", path: dist/carriers/*.tgz }
  build-wheels:
    needs: native-assets-and-carriers
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-apple-darwin, aarch64-apple-darwin, x86_64-pc-windows-msvc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        env: { RUSTFLAGS: "-D warnings" }
        with: { target: "${{ matrix.target }}", args: "--release --locked --out dist" }
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-${{ matrix.target }}", path: dist }
  build-distributions:
    needs: native-assets-and-carriers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv build sdks/python --out-dir dist/python-sdk
          ./scripts/nx.sh run sdk-typescript:build
          bun pm pack --cwd sdks/typescript --destination ../../dist/typescript-sdk
          bun pm pack --cwd npm/cli --destination ../../dist/npm
      - uses: actions/upload-artifact@v4
        with: { name: distributions, path: dist }
  publish-crates:
    needs: native-assets-and-carriers
    if: ${{ vars.CARGO_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "CARGO_REGISTRY_TOKEN is required" >&2; exit 1; }
          for crate in onetaskgraph-plugin-api onetaskgraph-in-memory onetaskgraph-local-md onetaskgraph-linear onetaskgraph-github-projects onetaskgraph-core onetaskgraph; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r --arg n "$crate" '.packages[]|select(.name==$n)|.version')
            printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' || { echo "invalid version for $crate: $version" >&2; exit 64; }
            status=$(curl -sS -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/$crate/$version") || { echo "could not query crates.io for $crate $version" >&2; exit 69; }
            case "$status" in
              200) ;;
              404) cargo publish -p "$crate" --locked ;;
              *) echo "crates.io query for $crate $version returned HTTP $status" >&2; exit 69 ;;
            esac
          done
  publish-python:
    needs: [build-wheels, build-distributions]
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "wheels-*", path: dist/cli, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: distributions, path: dist/all }
      - env: { UV_PUBLISH_TOKEN: "${{ secrets.PYPI_TOKEN }}" }
        run: |
          [ -n "$UV_PUBLISH_TOKEN" ] || { echo "PYPI_TOKEN is required" >&2; exit 1; }
          pip install uv
          uv publish --check-url https://pypi.org/simple/onetaskgraph-cli/ dist/cli/*
          uv publish --check-url https://pypi.org/simple/onetaskgraph-sdk/ dist/all/python-sdk/*
  publish-npm:
    needs: [native-assets-and-carriers, build-distributions]
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { pattern: "carrier-*", path: dist/carriers, merge-multiple: true }
      - env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "NPM_TOKEN is required" >&2; exit 1; }
          publish_if_absent() {
            spec=$1
            shift
            error="$RUNNER_TEMP/npm-view-error"
            if npm view "$spec" >/dev/null 2>"$error"; then return; fi
            if grep -Eq 'E404|404 Not Found' "$error"; then npm publish "$@" --access public; return; fi
            cat "$error" >&2
            echo "could not query npm for $spec" >&2
            exit 69
          }
          for package in npm/platforms/*; do
            name=$(node -p "require('./$package/package.json').name")
            version=$(node -p "require('./$package/package.json').version")
            platform=${package##*/}
            [[ $name == "@onetaskgraph/cli-$platform" ]] || { echo "invalid carrier name: $name" >&2; exit 64; }
            printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' || { echo "invalid carrier version: $version" >&2; exit 64; }
            publish_if_absent "$name@$version" "dist/carriers/onetaskgraph-cli-${platform}-${version}.tgz"
          done
          cli_version=$(node -p "require('./npm/cli/package.json').version")
          sdk_version=$(node -p "require('./sdks/typescript/package.json').version")
          printf '%s\n' "$cli_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' || { echo "invalid CLI version: $cli_version" >&2; exit 64; }
          printf '%s\n' "$sdk_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' || { echo "invalid TypeScript SDK version: $sdk_version" >&2; exit 64; }
          publish_if_absent "@onetaskgraph/cli@$cli_version" npm/cli
          publish_if_absent "@onetaskgraph/sdk@$sdk_version" sdks/typescript
# llmlint: ignore-end[changed_behavior_has_e2e]
