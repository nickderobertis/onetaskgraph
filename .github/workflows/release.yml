name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
# Every run step is one phase of the job's justfile recipe (scripts/release_cd.py). The build
# jobs do not wait on one another, and `publish` publishes nothing until all four have: a
# failed build leaves the other platforms published and the platform-independent packages
# unpublished until it is re-run, and a re-run sends only what is missing.
#
# llmlint: ignore-block[changed_behavior_has_e2e] Every run step below calls a recipe that .github/tests/release-cd.test.mjs drives on Linux against loopback registries; what is left is GitHub's own scheduling of these jobs on a published release, which a pre-publication dispatch cannot trigger.
jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    env: { TAG: "${{ github.event.release.tag_name }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { target: x86_64-unknown-linux-gnu }
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v4
      - name: Build, package and test-install the Linux artifacts
        run: just release-linux build --tag "$TAG"
      - name: Upload the Linux archive to the GitHub Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: just release-linux publish --to github --tag "$TAG"
      - name: Publish the Linux wheel to PyPI
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        env: { UV_PUBLISH_TOKEN: "${{ secrets.PYPI_TOKEN }}" }
        run: just release-linux publish --to pypi --tag "$TAG"
      - name: Publish the Linux npm platform package
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: just release-linux publish --to npm --tag "$TAG"
      - name: Install and run the Linux archive from the GitHub Release
        run: just release-linux verify --from github --tag "$TAG"
      - name: Install and run the Linux wheel from PyPI
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        run: just release-linux verify --from pypi --tag "$TAG"
      - name: Install and run the Linux npm platform package
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: just release-linux verify --from npm --tag "$TAG"
  # Native on GitHub's hosted ARM Linux runner, so the aarch64 artifacts are built, installed
  # and run on their own architecture rather than cross-compiled.
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions: { contents: write }
    env: { TAG: "${{ github.event.release.tag_name }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { target: aarch64-unknown-linux-gnu }
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v4
      - name: Build, package and test-install the Linux arm64 artifacts
        run: just release-linux-arm64 build --tag "$TAG"
      - name: Upload the Linux arm64 archive to the GitHub Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: just release-linux-arm64 publish --to github --tag "$TAG"
      - name: Publish the Linux arm64 wheel to PyPI
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        env: { UV_PUBLISH_TOKEN: "${{ secrets.PYPI_TOKEN }}" }
        run: just release-linux-arm64 publish --to pypi --tag "$TAG"
      - name: Publish the Linux arm64 npm platform package
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: just release-linux-arm64 publish --to npm --tag "$TAG"
      - name: Install and run the Linux arm64 archive from the GitHub Release
        run: just release-linux-arm64 verify --from github --tag "$TAG"
      - name: Install and run the Linux arm64 wheel from PyPI
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        run: just release-linux-arm64 verify --from pypi --tag "$TAG"
      - name: Install and run the Linux arm64 npm platform package
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: just release-linux-arm64 verify --from npm --tag "$TAG"
  # Apple Silicon alone: Intel macOS is no longer released, so nothing here cross-compiles
  # or emulates x86_64.
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions: { contents: write }
    env: { TAG: "${{ github.event.release.tag_name }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { target: aarch64-apple-darwin }
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v4
      - name: Build, package and test-install the macOS artifacts
        run: just release-macos build --tag "$TAG"
      - name: Upload the macOS archive to the GitHub Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: just release-macos publish --to github --tag "$TAG"
      - name: Publish the macOS wheel to PyPI
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        env: { UV_PUBLISH_TOKEN: "${{ secrets.PYPI_TOKEN }}" }
        run: just release-macos publish --to pypi --tag "$TAG"
      - name: Publish the macOS npm platform package
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: just release-macos publish --to npm --tag "$TAG"
      - name: Install and run the macOS archive from the GitHub Release
        run: just release-macos verify --from github --tag "$TAG"
      - name: Install and run the macOS wheel from PyPI
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        run: just release-macos verify --from pypi --tag "$TAG"
      - name: Install and run the macOS npm platform package
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: just release-macos verify --from npm --tag "$TAG"
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions: { contents: write }
    env: { TAG: "${{ github.event.release.tag_name }}" }
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { target: x86_64-pc-windows-msvc }
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v4
      - name: Build, package and test-install the Windows artifacts
        run: just release-windows build --tag "$TAG"
      - name: Upload the Windows archive to the GitHub Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: just release-windows publish --to github --tag "$TAG"
      - name: Publish the Windows wheel to PyPI
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        env: { UV_PUBLISH_TOKEN: "${{ secrets.PYPI_TOKEN }}" }
        run: just release-windows publish --to pypi --tag "$TAG"
      - name: Publish the Windows npm platform package
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: just release-windows publish --to npm --tag "$TAG"
      - name: Install and run the Windows archive from the GitHub Release
        run: just release-windows verify --from github --tag "$TAG"
      - name: Install and run the Windows wheel from PyPI
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        run: just release-windows verify --from pypi --tag "$TAG"
      - name: Install and run the Windows npm platform package
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: just release-windows verify --from npm --tag "$TAG"
  publish:
    needs: [build-linux, build-linux-arm64, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { TAG: "${{ github.event.release.tag_name }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v4
      # Nothing platform-independent is published until every platform is: the launcher
      # resolves a carrier at its own exact version, and the SDKs pin the CLI they drive.
      - name: Confirm the GitHub Release serves the archive of every platform
        run: just release-publish available --from github --tag "$TAG"
      - name: Confirm PyPI serves the wheel of every platform
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        run: just release-publish available --from pypi --tag "$TAG"
      - name: Confirm npm serves the package of every platform
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: just release-publish available --from npm --tag "$TAG"
      - name: Build the Python and TypeScript SDK distributions
        run: just release-publish build --tag "$TAG"
      - name: Publish the crates to crates.io
        if: ${{ vars.CARGO_PUBLISH == 'true' }}
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
        run: just release-publish publish --to crates --tag "$TAG"
      - name: Publish the Python SDK to PyPI
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        env: { UV_PUBLISH_TOKEN: "${{ secrets.PYPI_TOKEN }}" }
        run: just release-publish publish --to pypi --tag "$TAG"
      - name: Publish the npm launcher and the TypeScript SDK
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: just release-publish publish --to npm --tag "$TAG"
      - name: Confirm crates.io serves every crate
        if: ${{ vars.CARGO_PUBLISH == 'true' }}
        run: just release-publish verify --from crates --tag "$TAG"
      - name: Confirm PyPI serves the Python SDK
        if: ${{ vars.PYPI_PUBLISH == 'true' }}
        run: just release-publish verify --from pypi --tag "$TAG"
      - name: Confirm npm serves the launcher and the TypeScript SDK
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: just release-publish verify --from npm --tag "$TAG"
      # The final step position is kept for the budget tail onetaskgraph-ci-budgets adds.
# llmlint: ignore-end[changed_behavior_has_e2e]
