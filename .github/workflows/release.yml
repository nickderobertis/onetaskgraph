name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
# llmlint: ignore-block[changed_behavior_has_e2e] Proving these jobs requires publishing a GitHub Release and registry packages, which a pre-publication dispatch cannot perform.
jobs:
  native-assets-and-carriers:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz, npm: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz, npm: linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip, npm: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { target: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target "${{ matrix.target }}" -p onetaskgraph
        env: { RUSTFLAGS: "-D warnings" }
      # One packaging body, shared byte for byte with the macOS job below over `TARGETS`
      # pairs of <rust target>=<npm platform>; scripts/check-distribution-contract.sh holds
      # the two copies identical, so a fix to one cannot leave the other behind.
      - name: Archive, checksum, and attach
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          TARGETS: ${{ matrix.target }}=${{ matrix.npm }}
          EXT: ${{ matrix.ext }}
        run: |
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' || { echo "invalid release tag: $TAG" >&2; exit 64; }
          for pair in $TARGETS; do
            target="${pair%%=*}"; npm_platform="${pair#*=}"
            name="onetaskgraph-${TAG}-${target}"; bin="target/${target}/release/onetaskgraph"
            [ "$EXT" != zip ] || bin="${bin}.exe"
            if [ "$EXT" = zip ]; then 7z a "${name}.zip" "$bin"; else tar -czf "${name}.tar.gz" -C "$(dirname "$bin")" "$(basename "$bin")"; fi
            asset="${name}.${EXT}"
            if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
            gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
            mkdir -p "carrier/${npm_platform}/bin" "dist/carriers/${npm_platform}"
            cp "npm/platforms/${npm_platform}/package.json" "carrier/${npm_platform}/package.json"
            cp "$bin" "carrier/${npm_platform}/bin/$(basename "$bin")"
            npm pack ./carrier/"${npm_platform}" --pack-destination "dist/carriers/${npm_platform}"
          done
      - uses: actions/upload-artifact@v4
        with: { name: "carrier-${{ matrix.npm }}", path: "dist/carriers/${{ matrix.npm }}/*.tgz" }
  # Both macOS architectures in ONE job, native assets and wheels alike, rather than two
  # rows of the matrix above and two more of build-wheels below that could only start once
  # that whole matrix had finished. The account has one small macOS runner pool, shared with
  # every push to main, and four sequential macOS jobs queued a merge-to-PyPI behind itself
  # for hours (#1991). The runner is arm64 and cross-compiles the x86_64 target, which cargo
  # and maturin both do from one host once the target is installed; the artifact names are
  # the ones build-wheels and the carrier download below expect, so nothing downstream can
  # tell which job built them. The archives are uploaded before the wheels are built, which
  # is the order release-targets.toml relies on: a consumer of the archives waits on `pypi`.
  macos-assets-carriers-and-wheels:
    permissions:
      contents: write
    runs-on: macos-latest
    env:
      TARGETS: x86_64-apple-darwin=darwin-x64 aarch64-apple-darwin=darwin-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { target: "x86_64-apple-darwin,aarch64-apple-darwin" }
      - run: cargo build --release --locked --target x86_64-apple-darwin --target aarch64-apple-darwin -p onetaskgraph
        env: { RUSTFLAGS: "-D warnings" }
      - name: Archive, checksum, and attach
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          EXT: tar.gz
        run: |
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' || { echo "invalid release tag: $TAG" >&2; exit 64; }
          for pair in $TARGETS; do
            target="${pair%%=*}"; npm_platform="${pair#*=}"
            name="onetaskgraph-${TAG}-${target}"; bin="target/${target}/release/onetaskgraph"
            [ "$EXT" != zip ] || bin="${bin}.exe"
            if [ "$EXT" = zip ]; then 7z a "${name}.zip" "$bin"; else tar -czf "${name}.tar.gz" -C "$(dirname "$bin")" "$(basename "$bin")"; fi
            asset="${name}.${EXT}"
            if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
            gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
            mkdir -p "carrier/${npm_platform}/bin" "dist/carriers/${npm_platform}"
            cp "npm/platforms/${npm_platform}/package.json" "carrier/${npm_platform}/package.json"
            cp "$bin" "carrier/${npm_platform}/bin/$(basename "$bin")"
            npm pack ./carrier/"${npm_platform}" --pack-destination "dist/carriers/${npm_platform}"
          done
      - uses: actions/upload-artifact@v4
        with: { name: "carrier-darwin-x64", path: "dist/carriers/darwin-x64/*.tgz" }
      - uses: actions/upload-artifact@v4
        with: { name: "carrier-darwin-arm64", path: "dist/carriers/darwin-arm64/*.tgz" }
      - uses: PyO3/maturin-action@v1
        env: { RUSTFLAGS: "-D warnings" }
        with: { target: "x86_64-apple-darwin", args: "--release --locked --out dist/wheels/x86_64-apple-darwin" }
      - uses: PyO3/maturin-action@v1
        env: { RUSTFLAGS: "-D warnings" }
        with: { target: "aarch64-apple-darwin", args: "--release --locked --out dist/wheels/aarch64-apple-darwin" }
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-x86_64-apple-darwin", path: dist/wheels/x86_64-apple-darwin }
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-aarch64-apple-darwin", path: dist/wheels/aarch64-apple-darwin }
  build-wheels:
    needs: native-assets-and-carriers
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        env: { RUSTFLAGS: "-D warnings" }
        with: { target: "${{ matrix.target }}", args: "--release --locked --out dist" }
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-${{ matrix.target }}", path: dist }
  build-distributions:
    needs: native-assets-and-carriers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv build sdks/python --out-dir dist/python-sdk
          ./scripts/nx.sh run sdk-typescript:build
          bun pm pack --cwd sdks/typescript --destination ../../dist/typescript-sdk
          bun pm pack --cwd npm/cli --destination ../../dist/npm
      - uses: actions/upload-artifact@v4
        with: { name: distributions, path: dist }
  publish-crates:
    needs: native-assets-and-carriers
    if: ${{ vars.CARGO_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "CARGO_REGISTRY_TOKEN is required" >&2; exit 1; }
          for crate in onetaskgraph-plugin-api onetaskgraph-in-memory onetaskgraph-local-md onetaskgraph-linear onetaskgraph-github-projects onetaskgraph-status-options onetaskgraph-core onetaskgraph; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r --arg n "$crate" '.packages[]|select(.name==$n)|.version')
            publication=$(scripts/crate-publication-status.sh "$crate" "$version") || exit $?
            case "$publication" in
              published) ;;
              absent) scripts/crate-sibling-resolution.sh "$crate" || exit $?; RUSTFLAGS='-D warnings' cargo publish -p "$crate" --locked ;;
              *) echo "unusable crates.io answer for $crate $version: $publication" >&2; exit 69 ;;
            esac
          done
  publish-python:
    needs: [build-wheels, macos-assets-carriers-and-wheels, build-distributions]
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "wheels-*", path: dist/cli, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: distributions, path: dist/all }
      - env: { UV_PUBLISH_TOKEN: "${{ secrets.PYPI_TOKEN }}" }
        run: |
          [ -n "$UV_PUBLISH_TOKEN" ] || { echo "PYPI_TOKEN is required" >&2; exit 1; }
          pip install uv
          uv publish --check-url https://pypi.org/simple/onetaskgraph-cli/ dist/cli/*
          uv publish --check-url https://pypi.org/simple/onetaskgraph-sdk/ dist/all/python-sdk/*
  publish-npm:
    needs: [native-assets-and-carriers, macos-assets-carriers-and-wheels, build-distributions]
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { pattern: "carrier-*", path: dist/carriers, merge-multiple: true }
      - env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        # The publication itself is scripts/publish-npm.sh rather than a block of YAML
        # here, because a release is the only thing that runs this job — so a defect in it
        # was discoverable only by cutting a version, which is how this repository stayed
        # absent from npm with a publish-npm job on main. scripts/check-npm-publish.sh runs
        # that same script against a registry it stands up, on every `just check`.
        run: scripts/publish-npm.sh
# llmlint: ignore-end[changed_behavior_has_e2e]
