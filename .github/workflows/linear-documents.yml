# Fresh creation coverage is daily; change-triggered affected checks reuse standing slots.
name: Linear document creation

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-latest
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      LINEAR_WRITE_TEAM: ${{ vars.LINEAR_WRITE_TEAM }}
      ONETASKGRAPH_LIVE_REQUIRED: "1"
      ONETASKGRAPH_LINEAR_DOCUMENT_MODE: ${{ github.event_name == 'schedule' && 'fresh' || 'initialize' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: extractions/setup-just@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Prove document creation or initialize missing slots
        run: just linear-document-creation
