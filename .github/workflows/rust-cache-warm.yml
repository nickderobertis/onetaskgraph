# Build, testing nothing, what test-linux, test-windows and test-macos build, and save it under
# the key each restores; AGENTS.md says why main must, and why its macOS leg is allowed.
# .github/tests/rust-cache-warm.test.mjs holds each leg to its job's key and build inputs.

name: rust cache warm

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    name: warm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            job: test-linux
            build: --instrumented
          - os: windows-latest
            job: test-windows
            build: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Defender scanning each file the build writes slows it; the cache key reads none of this.
      - name: Keep Defender's real-time scan off the build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:LOCALAPPDATA\uv", $env:RUNNER_TEMP, $env:TEMP
      # The distribution journey's release build runs maturin through uv.
      - uses: astral-sh/setup-uv@v7
      # The key the pull-request job restores; rust-cache adds the OS, the toolchain and every
      # Cargo manifest and lockfile to it.
      # rust-cache hashes every installed compiler; exclude the unused floating one.
      - name: Exclude the unused floating compiler from the build cache
        shell: bash
        run: rustup toolchain uninstall stable
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ${{ matrix.job }}
      - uses: taiki-e/install-action@v2
        if: matrix.build == '--instrumented'
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Build what ${{ matrix.job }} builds
        shell: bash
        run: bash scripts/warm-rust-cache.sh ${{ matrix.build }}
      # test-linux's own builds over what was just built, which must recompile no dependency:
      # a push to main fails the moment the cache it saves is not one a pull request reuses.
      - uses: extractions/setup-just@v4
        if: matrix.job == 'test-linux'
      - name: Check what test-linux builds reuses this build
        if: matrix.job == 'test-linux'
        shell: bash
        run: just warm-cache-reuse-check-warmed

  # Fails open: anything but a clean `true` — a failed or undecided classifier, or this job
  # failing outright — still warms macOS, as a cold build costs every pull request more.
  release-merge:
    name: release merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version-only: ${{ steps.decide.outputs.version-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: extractions/setup-just@v4
      - run: just github-workflows-bootstrap
      - name: Decide whether the push changes only release versions and changelogs
        id: decide
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          answer="$(python3 .github/semantic-release.py "$BEFORE" "$AFTER" | tr -d '\r')" || answer=false
          [ "$answer" = true ] || answer=false
          echo "version-only=$answer" >>"$GITHUB_OUTPUT"

  warm-macos:
    name: warm (macos-latest)
    needs: [release-merge]
    if: ${{ !cancelled() && needs.release-merge.outputs.version-only != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      # rust-cache hashes every installed compiler; exclude the unused floating one.
      - name: Exclude the unused floating compiler from the build cache
        shell: bash
        run: rustup toolchain uninstall stable
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: test-macos
      - name: Build what test-macos builds
        shell: bash
        run: bash scripts/warm-rust-cache.sh
