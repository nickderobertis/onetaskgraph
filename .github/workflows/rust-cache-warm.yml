# Build, testing nothing, what test-linux and test-windows build, and save it under the key each
# restores; AGENTS.md says why main must. No macOS leg: a push to main schedules no Mac job.
# .github/tests/rust-cache-warm.test.mjs holds each leg to its job's key and build inputs.

name: rust cache warm

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    name: warm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            job: test-linux
            build: --instrumented
          - os: windows-latest
            job: test-windows
            build: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Defender scanning each file the build writes slows it; the cache key reads none of this.
      - name: Keep Defender's real-time scan off the build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:LOCALAPPDATA\uv", $env:RUNNER_TEMP, $env:TEMP
      # The distribution journey's release build runs maturin through uv.
      - uses: astral-sh/setup-uv@v7
      # The key the pull-request job restores; rust-cache adds the OS, the toolchain and every
      # Cargo manifest and lockfile to it.
      # rust-cache hashes every installed compiler; exclude the unused floating one.
      - name: Exclude the unused floating compiler from the build cache
        shell: bash
        run: rustup toolchain uninstall stable
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ${{ matrix.job }}
      - uses: taiki-e/install-action@v2
        if: matrix.build == '--instrumented'
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Build what ${{ matrix.job }} builds
        shell: bash
        run: bash scripts/warm-rust-cache.sh ${{ matrix.build }}
      # test-linux's own builds over what was just built, which must recompile no dependency:
      # a push to main fails the moment the cache it saves is not one a pull request reuses.
      - uses: extractions/setup-just@v4
        if: matrix.job == 'test-linux'
      - name: Check what test-linux builds reuses this build
        if: matrix.job == 'test-linux'
        shell: bash
        run: just warm-cache-reuse-check-warmed

