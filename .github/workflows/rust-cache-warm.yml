# Build what test-linux and test-windows build on every push to main, and save it as the Rust
# cache those pull-request jobs restore: a pull request restores only caches saved on its own
# ref or on main, and those jobs run on pull requests alone, so without this every pull request
# compiled every dependency. Nothing is tested here, and there is no macOS leg: main pushes
# never schedule Mac (AGENTS.md). scripts/warm-rust-cache.sh says what is built and why.

name: rust cache warm

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    name: warm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            job: test-linux
            build: --instrumented
          - os: windows-latest
            job: test-windows
            build: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # As test-windows does, for the same reason.
      - name: Keep Defender's real-time scan off the build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:LOCALAPPDATA\uv", $env:RUNNER_TEMP, $env:TEMP
      # The distribution journey's release build runs maturin through uv.
      - uses: astral-sh/setup-uv@v7
      # The key the pull-request job restores; rust-cache adds the OS, the toolchain and every
      # Cargo manifest and lockfile to it.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ${{ matrix.job }}
      - uses: taiki-e/install-action@v2
        if: matrix.build == '--instrumented'
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Build what ${{ matrix.job }} builds
        shell: bash
        run: bash scripts/warm-rust-cache.sh ${{ matrix.build }}
