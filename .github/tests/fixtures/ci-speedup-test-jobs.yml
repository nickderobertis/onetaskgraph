# llmlint: ignore-file[contracts_have_one_source_or_a_drift_gate] The authoritative jobs are on #3642's unmerged branch, which no gate here can read; the manager ruled this verbatim snapshot until they land, and rust-cache-warm.test.mjs refuses it the moment ci.yml has any of them, so the change that lands them must delete it.
# The Rust-cache-relevant half of the three pull-request test jobs .github/workflows/rust-cache-warm.yml
# warms, copied verbatim from #3642 (branch nick/3632/onetaskgraph-ci-speedup) at
# ef1322ea6c3abf9baafe0d780825cdaab9f4746b: each job's runner and job-level env, its
# floating-compiler removal, its setup-rust-toolchain step, its tool install and the step that
# runs its build (that step's own env, credentials and nominations, left out: rust-cache keys
# nothing on it). `phases` is that job's arm of scripts/ci-job.sh at the same commit.
#
# Those jobs are not yet in main's ci.yml, and the warmer exists so their runs restore a warm
# cache. .github/tests/rust-cache.test.mjs compares each warmer leg with its job in ci.yml when
# ci.yml has it and with this file when it does not, and fails when a job is in both: delete
# this file in the change that adds them to ci.yml.
jobs:
  test-linux:
    runs-on: ubuntu-latest
    env:
      ONETASKGRAPH_SDK_WITHOUT_CLI: "1"
      UV_NO_SYNC: "1"
    steps:
      - name: Exclude the unused floating compiler from the build cache
        if: steps.release.outputs.tests == 'run'
        shell: bash
        run: rustup toolchain uninstall stable
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.release.outputs.tests == 'run'
        with:
          cache-shared-key: test-linux
      - uses: taiki-e/install-action@v2
        if: steps.release.outputs.tests == 'run'
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-machete,cargo-deny,cargo-binstall
      - name: Test the affected projects
        if: steps.release.outputs.tests == 'run'
        run: just ci-test-linux
    phases: |-
      1 affected test tag:test-in-coverage:*,onetaskgraph-linear,onetaskgraph-linear-e2e
      1 affected test *,!onetaskgraph-linear,!onetaskgraph-linear-e2e
      1 affected test-uncovered,coverage tag:layer:sdk
      1 affected coverage *,!tag:layer:sdk
      1 run scripts:distribution-check -
      1 run scripts:distribution-test -
      2 affected budgets - --excludeTaskDependencies,--skipNxCache
  test-windows:
    runs-on: windows-latest
    env:
      ONETASKGRAPH_SDK_WITHOUT_CLI: "1"
      UV_NO_SYNC: "1"
      NX_PLUGIN_NO_TIMEOUTS: "true"
    steps:
      - name: Exclude the unused floating compiler from the build cache
        if: steps.release.outputs.tests == 'run'
        shell: bash
        run: rustup toolchain uninstall stable
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.release.outputs.tests == 'run'
        with:
          cache-shared-key: test-windows
      - uses: taiki-e/install-action@v2
        if: steps.release.outputs.tests == 'run'
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-machete,cargo-deny,cargo-binstall
      - name: Test the affected projects
        if: steps.release.outputs.tests == 'run'
        run: just ci-test-windows
    phases: |-
      1 affected test,budgets - --parallel=4
      1 run scripts:distribution-check -
      1 run scripts:distribution-test -
  test-macos:
    runs-on: macos-latest
    env:
      ONETASKGRAPH_SDK_WITHOUT_CLI: "1"
      UV_NO_SYNC: "1"
    steps:
      - name: Exclude the unused floating compiler from the build cache
        if: steps.release.outputs.tests == 'run'
        shell: bash
        run: rustup toolchain uninstall stable
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.release.outputs.tests == 'run'
        with:
          cache-shared-key: test-macos
      - uses: taiki-e/install-action@v2
        if: steps.release.outputs.tests == 'run'
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-machete,cargo-deny,cargo-binstall
      - name: Test the affected projects
        if: steps.release.outputs.tests == 'run'
        run: just ci-test-macos
    phases: |-
      1 affected test,budgets -
      1 run scripts:distribution-check -
      1 run scripts:distribution-test -
