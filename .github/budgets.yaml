schema_version: 1
budgets:
  # llmlint: ignore[budgets_track_product_owner_outcomes] The brief explicitly requests jobs/run and Mac-spending runs/change bounds; the manager approved separate budgets for these scheduling constraints.
  - id: onetaskgraph-macos-jobs-per-run
    description: >-
      Records Mac job instances from resolved workflow telemetry to protect the shared
      five-runner pool. inner_measure_reason: one run can occupy several shared Mac slots
      while lifecycle run count stays within its bound.
    measure: reported
    command: [node, macos-budget.mjs, --metric, jobs-per-run, --telemetry, .telemetry/macos-policy.json]
    unit: jobs
    direction: max
    threshold: 1
    timeout_seconds: 30
  # llmlint: ignore[budgets_track_product_owner_outcomes] The brief explicitly requests jobs/run and Mac-spending runs/change bounds; the manager approved separate budgets for these scheduling constraints.
  - id: onetaskgraph-macos-runs-per-change
    description: >-
      Records distinct Mac-spending runs across the complete single-push lifecycle to
      protect queue capacity shared with dependent releases.
    measure: reported
    command: [node, macos-budget.mjs, --metric, runs-per-change, --telemetry, .telemetry/macos-policy.json]
    unit: runs
    direction: max
    threshold: 2
    timeout_seconds: 30
