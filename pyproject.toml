[project]
name = "onetaskgraph-cli"
version = "0.2.21"
description = "The onetaskgraph command-line interface."
requires-python = ">=3.9"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/onetaskgraph/Cargo.toml"
strip = true

[tool.uv.workspace]
members = ["sdks/python"]
