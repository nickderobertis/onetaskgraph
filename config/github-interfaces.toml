# GitHub's interface as a release calls it, pinned.
#
# Two scripts call GitHub during a release: scripts/release_cd.py reads a release by tag and
# uploads and deletes its assets, and scripts/enable-release-automerge.py lists the open pull
# requests and asks GraphQL's enablePullRequestAutoMerge for release-plz's one. The release
# journeys stand GitHub in with scripts/loopback-release-registries.py. All three restate a
# third party's interface, so it is pinned here the way config/registry-interfaces.toml pins
# the registries': a recorded observation with its provenance, which a deterministic check
# holds the code to. .github/tests/github_interfaces.py, run by
# .github/tests/github-interfaces.test.mjs in github-workflows:test, fails when
#
#   - the GraphQL document the auto-merge step sends is not the one pinned here, or names a
#     field, argument, input field or enum value the pinned schema slice does not have;
#   - a parser the release uses does not accept the pinned answer, reads something other than
#     what `reads` names, or still accepts the answer unchanged with one of those fields gone;
#   - the double answers a call with a field the pinned answer does not carry.
#
# Every `answer` is a real capture, trimmed only inside nested objects nothing reads, except
# the GraphQL answer: enabling auto-merge is a write a check must not make, so that answer is
# the shape the introspected schema slice below gives the pinned document. When GitHub moves,
# re-observe here (the `observed_from` of each entry is the request to repeat) and bring the
# scripts and the double with it.

