[graphql.objects.EnablePullRequestAutoMergePayload]
actor = "Actor"
clientMutationId = "String"
pullRequest = "PullRequest"

[graphql.objects.PullRequest]
number = "Int"
autoMergeRequest = "AutoMergeRequest"

[graphql.objects.AutoMergeRequest]
mergeMethod = "PullRequestMergeMethod"

[graphql.arguments]
"Mutation.enablePullRequestAutoMerge" = { input = "EnablePullRequestAutoMergeInput" }

[graphql.inputs.EnablePullRequestAutoMergeInput]
