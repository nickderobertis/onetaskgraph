# PyPI's JSON simple index (PEP 691), as scripts/release_cd.py reads it, pinned.
#
# A release's PyPI step asks the index which of its files PyPI already holds, and with what
# SHA-256, before it hands uv anything: PyPI never replaces a file, so one it holds with other
# bytes than a re-run's rebuild is kept as the release's rather than sent and refused. That
# answer is PyPI's interface rather than this repository's, so it is pinned here the way
# config/github-interfaces.toml pins GitHub's: a recorded observation, with its provenance.
# .github/tests/release-cd.test.mjs holds `parse_pypi_index` to it — it accepts the answer,
# and every field `reads` names, and no other, changes what it answers — and holds the
# loopback double's index to it: the double answers no field this answer does not carry.
#
# The answer is a real capture trimmed to two of its files and two of its versions; nothing
# else in it is edited. Re-observe it with the request below when PyPI moves.

documentation = "https://packaging.python.org/en/latest/specifications/simple-repository-api/#json-serialization"
observed = "2026-11-08"
observed_from = "GET https://pypi.org/simple/onetaskgraph-cli/ (Accept: application/vnd.pypi.simple.v1+json)"
method = "GET"
url = "https://pypi.org/simple/{project}/"
accept = "application/vnd.pypi.simple.v1+json"
reads = ["files[].filename", "files[].hashes.sha256"]
