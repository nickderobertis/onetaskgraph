[package]
name = "onetaskgraph"
description = "One interface over the ticketing systems your work lives in."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "onetaskgraph"
path = "src/main.rs"

# The binary is the one crate permitted to depend on the engine — deny.toml names
# it as `onetaskgraph-core`'s only wrapper, so a plugin taking the same dependency
# fails the required `deny` check.
[dependencies]
clap.workspace = true
onetaskgraph-core.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
serde_json.workspace = true
