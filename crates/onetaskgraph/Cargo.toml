[package]
name = "onetaskgraph"
description = "One interface over the ticketing systems your work lives in."
version = "0.3.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "onetaskgraph"
path = "src/main.rs"

# The plugin side of the stdio protocol, hosting any plugin of this build in a child
# process. It is a binary target because it is the reference implementation a plugin author
# reads beside `docs/plugin-protocol.md`, and because it is what the journeys configure so
# that every one of them runs a second time over a real pipe to a real second process. It is
# not part of the command-line interface: nothing may depend on finding it beside an
# installed `onetaskgraph`.
[[bin]]
name = "onetaskgraph-source"
path = "src/bin/onetaskgraph-source.rs"

# The one crate permitted to depend on the engine; deny.toml names it as such.
[dependencies]
chrono.workspace = true
schemars.workspace = true
clap.workspace = true
# The per-variable prompts of `template render`. This crate alone: nothing below the command
# line prompts, so no other crate may depend on it.
# llmlint: ignore[new_command_or_client_gets_its_own_project] `template` is a verb of this same `onetaskgraph` command, not a second entry point or an external-system client: it reaches no network and no source, and its journeys run in about a second without a credential. The task that added it names it as `onetaskgraph template …`, which only this crate can answer.
dialoguer.workspace = true
# Both network destinations: the binary this repository ships registers every plugin kind,
# and so does `onetaskgraph-source`, the reference host the journeys drive them through.
onetaskgraph-core = { workspace = true, features = ["github-projects", "linear"] }
# `sources fields` reports a Linear source's workflow states through the plugin's own
# `workflow_states`, and the e2e fake answers the GraphQL documents the plugin declares.
onetaskgraph-linear.workspace = true
# The contract crate directly, not through the engine: this binary renders the work types
# a source returns, and re-exporting them from the engine would make the engine's public
# surface a second place the contract is spelled.
onetaskgraph-plugin-api.workspace = true
onetaskgraph-status-options.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# No dev-dependencies: the journeys that drive this binary are the test-only e2e members
# (crates/onetaskgraph-e2e and one per plugin crate they exercise), which spawn the build
# `onetaskgraph:build` makes. What stays in tests/ here reads the public registries alone.
