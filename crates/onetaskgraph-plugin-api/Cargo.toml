[package]
name = "onetaskgraph-plugin-api"
description = "The plugin contract onetaskgraph sources implement: the traits, the work types, and the capability declaration."
version = "0.3.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Nothing of this workspace belongs here — see the invariant in AGENTS.md.
[dependencies]
async-trait.workspace = true
# An asset's bytes cross the out-of-process protocol as base64.
base64.workspace = true
chrono.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
# An asset's SHA-256, and the `body_digest` a rendering re-records when a source rewrites its
# asset references.
sha2.workspace = true
thiserror.workspace = true
# `system_clock`'s sleep. Only `time` is needed; the workspace entry's other features are
# already compiled for every plugin that depends on this crate.
tokio.workspace = true

[dev-dependencies]
