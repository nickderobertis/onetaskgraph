[package]
name = "onetaskgraph-github-live"
description = "The GitHub Projects live lane's own policy: its artifact names and the repositories it writes to and refuses."
# Not published, for the reason `onetaskgraph-live` is not: the GitHub Projects plugin names
# it as a path-only dev-dependency, which cargo strips when it packages that crate.
# llmlint: ignore[crates_stay_in_one_cargo_workspace] A literal rather than `version.workspace = true` because that is what every crate manifest of this workspace spells, and `scripts/product_versions.py` writes and checks this line, so the two cannot drift.
version = "0.3.5"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The cross-lane stamp grammar, whose widest value these names must leave room for.
onetaskgraph-live.workspace = true
