[package]
name = "onetaskgraph-local-md"
description = "A onetaskgraph source over Markdown task files on the local filesystem."
version = "0.2.44"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
onetaskgraph-plugin-api.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true

# The delete-pending probe the read path puts a refused read to, and nothing else. Windows
# is the only platform that has the state to probe for, so this is the only platform that
# compiles the probe.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
secrecy.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
