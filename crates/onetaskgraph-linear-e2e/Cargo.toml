[package]
name = "onetaskgraph-linear-e2e"
description = "The Linear plugin's journeys, driven through the compiled onetaskgraph binary."
# Test-only and never published: it holds nothing but `tests/`, which spawn the binary
# `onetaskgraph:build` made.
# Inherited, never a literal: nothing publishes it, so no release reads a number here, and a
# branch cut before a release cannot land it at the version that release moved past.
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Every dependency is a dev-dependency: the package has no library or binary of its own.
[dev-dependencies]
# The warm budget measurements drive the engine the binary links, as a long-lived caller holds
# one source instance across writes.
onetaskgraph-core = { workspace = true, features = ["linear"] }
onetaskgraph-e2e-support.workspace = true
onetaskgraph-linear.workspace = true
onetaskgraph-plugin-api.workspace = true
# The budgets runner hands each figure the journeys recorded to `onebudgetspec check`.
onebudgetspec-core.workspace = true
# Compiles onebudgetspec's own id pattern, which the runner holds its budget id to.
regex.workspace = true
serde_json.workspace = true
# Reads budgets.yaml in the test holding its commands to what every runner can start.
serde_norway.workspace = true
tokio.workspace = true

# The asset live journey opens the same credential gate as the plugin lane.
onetaskgraph-live.workspace = true
reqwest.workspace = true
