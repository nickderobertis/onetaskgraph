# The requests a Linear status write sends, counted at the loopback Linear's endpoint by the
# journeys of tests/e2e/linear_budget.rs while this project's `test` target runs. Each budget's
# command is tests/e2e/budget_runner.rs, which reports what that run recorded.
schema_version: 1
budgets:
  - id: linear-requests-per-status-write-cold
    description: >-
      The requests one status write sends on a fresh source instance, as one command line is.
      It protects headroom on the production Linear key every manager of a host shares.
    labels: [linear]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 2
  - id: linear-requests-per-status-write-warm
    description: >-
      The requests each status write after the first sends on one long-lived source instance.
      It protects headroom on the production Linear key every manager of a host shares.
    labels: [linear]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 1
  - id: linear-requests-per-settlement-update-cold
    description: >-
      The requests the first update of a status and one metadata key sends on a fresh source
      instance. It protects headroom on the production Linear key every manager of a host shares.
    labels: [linear]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 3
  - id: linear-requests-per-settlement-update-warm
    description: >-
      The requests each later update of a status and one metadata key sends on one long-lived
      source instance. It protects headroom on the production Linear key every manager of a host
      shares.
    labels: [linear]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 2
  - id: linear-asset-requests-per-new-asset
    description: >-
      An inner measure of the requests added by new document and issue images protects headroom on a production Linear key every manager of a host shares, which no check may reach.
    labels: [linear]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 3
  - id: linear-asset-requests-per-unchanged-asset
    description: >-
      An inner measure of requests added by three unchanged re-copies protects headroom on a production Linear key every manager of a host shares, which no check may reach.
    labels: [linear]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 0
  - id: linear-asset-copy-seconds
    description: >-
      An inner measure of a plan-copy operation (project copy followed by each document copy into the copied project) duration in simulated time against a loopback modelling Linear latency and limits protects the time a person waits, because the production key may not be spent by a check and the measurement costs no gate time.
    labels: [linear]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: seconds
    direction: max
    threshold: 90
  - id: linear-concurrent-copies-refused
    # llmlint: ignore[contracts_have_one_source_or_a_drift_gate] Linear's published quota is prose with a source URL, verified by external audit; loopback_request_limit_and_budget_description_agree reconciles this description with the deterministic loopback model without fetching the page during cached checks.
    description: >-
      An inner measure of concurrent plan-copy operation refusals (each project copy followed by its document copies into the copied project) in simulated time against a loopback modelling Linear latency and limits avoids spending the production key and costs no gate time. The GraphQL limit is 2500 requests per 3600 seconds per authenticated user across API keys, refilled as a leaky bucket, from https://linear.app/developers/rate-limiting.
    labels: [linear]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: copies
    direction: max
    threshold: 0
  - id: linear-cache-cost-not-above-uncached
    description: >-
      The requests one hour of the assumed workload saves with the Linear cache on — three hosts,
      each a cold and a warm pass over 10 projects, 40 documents and 60 issues against the
      loopback Linear — the smaller of 1x and 10x of cache off minus cache on. It protects the
      shared key's 2,500 requests an hour from what the cache adds.
    labels: [linear]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file names the crate's one shared report-only runner, budget_runner::report, which reads the record ONEBUDGETSPEC_BUDGET_ID selects; this one follows that convention, as its task fixes. The runner reads only the telemetry the journey recorded and hands it to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: requests
    direction: min
    threshold: 1
  # llmlint: ignore[budgets_track_product_owner_outcomes] A different limit from the hourly complexity quota: Linear refuses any one query above 10,000 complexity outright, whatever the hour has spent, so the dearest single query is an outcome of its own (a read that fails), not a share of the hourly total; the task fixes it as its own budget at 9,000.
  - id: linear-cache-largest-query-complexity
    description: >-
      The dearest single query any Linear read sends with the cache on over the same hour at 1x
      and 10x. It protects every widened read from Linear's per-query complexity cap of 10,000,
      which refuses a query outright.
    labels: [linear]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] As the cache cost budget above: the crate's one shared report-only runner reads the record ONEBUDGETSPEC_BUDGET_ID selects and hands it to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: points
    direction: max
    threshold: 9000
  - id: linear-hourly-requests-1x
    description: >-
      The requests one hour of the assumed workload at 1x sends Linear with the cache on, each
      host's first pass cold and its second warm. It protects the share of the key's 2,500
      requests an hour this workload may take from people and other tools.
    labels: [linear]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] As the cache cost budget above: the crate's one shared report-only runner reads the record ONEBUDGETSPEC_BUDGET_ID selects and hands it to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 250
  - id: linear-hourly-requests-10x
    description: >-
      The requests the same cold-then-warm hour sends Linear with the cache on at 10x. It
      protects the key's 2,500 requests an hour from this workload at its largest scale.
    labels: [linear]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] As the cache cost budget above: the crate's one shared report-only runner reads the record ONEBUDGETSPEC_BUDGET_ID selects and hands it to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 2500
  - id: linear-hourly-requests-10x-warm
    description: >-
      The requests an hour at 10x sends Linear with the cache on when every pass is warm, as on a
      host whose cache an earlier hour filled. It protects the share of the key's 2,500 requests
      an hour a settled host may take.
    labels: [linear]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] As the cache cost budget above: the crate's one shared report-only runner reads the record ONEBUDGETSPEC_BUDGET_ID selects and hands it to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 1250
  # llmlint: ignore[budgets_track_product_owner_outcomes] Linear meters a key by two separate hourly quotas, 2,500 requests and 3,000,000 complexity, and either can run out first; this budget is the complexity quota's share, which the request budgets cannot see, and the manager's ruling of 2026-10-14 sets it as its own budget at that share.
  - id: linear-hourly-complexity-10x
    description: >-
      The complexity the cold-then-warm hour at 10x spends with the Linear cache on, each request
      priced as the cache cost budget prices it. It protects the share of the key's 3,000,000
      complexity an hour this workload may take from people and other tools.
    labels: [linear]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] As the cache cost budget above: the crate's one shared report-only runner reads the record ONEBUDGETSPEC_BUDGET_ID selects and hands it to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-linear-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture"]
    unit: points
    direction: max
    threshold: 750000
