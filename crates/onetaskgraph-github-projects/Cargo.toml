[package]
name = "onetaskgraph-github-projects"
description = "A onetaskgraph source over GitHub Projects."
version = "0.12.14"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
github-graphql-node-count.workspace = true
onetaskgraph-plugin-api.workspace = true
reqwest = { version = "0.12.23", default-features = false, features = ["json", "native-tls-vendored"] }
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
# The timer, for waiting a rate limit out and spacing this source's own mutations. It
# needs no runtime of its own — the caller already has one.
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
graphql-parser.workspace = true
# What `tests/github_schema/mod.rs` validates a request against GitHub's published schema with.
apollo-compiler.workspace = true
# The gate this crate's live session opens; see crates/onetaskgraph-live.
onetaskgraph-live.workspace = true
# The lane's artifact names and repositories, which the janitor reads too.
onetaskgraph-github-live.workspace = true
serde_json.workspace = true
# The digest `tests/plugin.rs` pins the vendored copy of GitHub's published schema to.
sha2.workspace = true
# `test-util` for a paused clock: the fixture wait's deadline is proven on virtual time, where
# no host's pace can move it.
tokio = { workspace = true, features = ["test-util"] }
