# Authoritative GitHub.com GraphQL read/write contract subset.
# The full schema is intentionally reduced to the types and fields selected by this plugin;
# tests validate every production document against this artifact.
#
# `ProjectV2.shortDescription` and `ProjectV2.readme` are absent on purpose, and so is
# `updateProjectV2`: a board is a container of projects here, never a project, and nothing
# this source does writes the board's own fields. `updateProjectV2Field` is present only
# for the guarded status-options document, whose caller sends all existing option ids and
# verifies every id and item assignment after GitHub replaces the complete option set.
#
# `createProjectV2Field` (with `CreateProjectV2FieldInput`, `ProjectV2CustomFieldType` and
# `CreateProjectV2FieldPayload`) and `clearProjectV2ItemFieldValue` (with
# `ClearProjectV2ItemFieldValueInput` and `ClearProjectV2ItemFieldValuePayload`) were copied from
# GitHub's published GraphQL schema reference (docs.github.com/en/graphql/reference/mutations,
# /input-objects, /enums and /objects), retrieved 2026-09-26, reduced to the members this plugin
# sends and selects. The first is sent only by the guarded field setup, for a `Priority` field a
# board lacks; the second clears one item's `Priority` value, which is what a `none` priority is.
# `ProjectV2Item.fieldValueByName(name: String!): ProjectV2ItemFieldValue` is pinned from
# https://docs.github.com/en/graphql/reference/projects#projectv2item (2026-10-01).
# Priority writes select that value from their mutation payload instead of reading the issue again.
# `Repository.issue(number: Int!): Issue` is pinned from
# https://docs.github.com/en/graphql/reference/objects#repository (2026-10-18): `task status
# complete` reads each issue a landing closed by its reference, and never the board.
#
# `ProjectV2Item.updatedAt: DateTime!` ("Identifies the date and time when the object was last
# updated") and `IssueCommentConnection.totalCount: Int!` ("Identifies the total count of items in
# the connection") are pinned from https://docs.github.com/en/graphql/reference/objects
# (2026-10-10). They are two of the five parts of a task's change token; a third,
# `Issue.updatedAt`, was already selected.
#
# `Issue.timelineItems(since, skip, itemTypes: [IssueTimelineItemsItemType!], after, before, first,
# last): IssueTimelineItemsConnection!`, that connection's `totalCount: Int!` ("Identifies the
# total count of items in the connection") and the six `IssueTimelineItemsItemType` members
# `BLOCKED_BY_ADDED_EVENT`, `BLOCKED_BY_REMOVED_EVENT`, `BLOCKING_ADDED_EVENT`,
# `BLOCKING_REMOVED_EVENT`, `PARENT_ISSUE_ADDED_EVENT` and `PARENT_ISSUE_REMOVED_EVENT` were read
# by introspecting GitHub.com's GraphQL API on 2026-10-11, the enum reduced to those six — the
# credentialed lane's `CONTRACT_ENUMS` re-reads them from GitHub every run — and an `itemTypes`-filtered
# `totalCount` observed counting only the named types. They are the fourth part of a task's
# change token, the relationship-event count: the credentialed lane saw a dependency added to a
# real issue move neither time nor the comment count.
#
# `ProjectV2Field.dataType: ProjectV2FieldType!` — "The field's type." — and that enum's members
# were read from GitHub.com's own published schema artifact
# <https://docs.github.com/public/fpt/schema.docs.graphql> on 2026-10-10, the enum reduced to the
# one member this plugin reads: a text field and a number or date field are all
# `ProjectV2Field`, so `dataType` is what tells a board text field a projected metadata value can
# be written to from one it cannot, and every other member reads as not a text field. The same artifact declares
# `CreateProjectV2FieldInput.dataType: ProjectV2CustomFieldType!`, whose `TEXT` member is what
# the guarded field setup creates a missing projected field with.
#
# `CreateIssueInput.projectV2Ids: [ID!]` — "An array of Node IDs for Projects V2 associated with
# this issue", `@possibleTypes(concreteTypes: ["ProjectV2"])` — was read from GitHub.com's own
# published schema artifact <https://docs.github.com/public/fpt/schema.docs.graphql> on
# 2026-10-01 and again on 2026-10-20. Put to a real board on 2026-10-01, a create naming the
# board was answered with no item in `Issue.projectItems`, and the `addProjectV2ItemById` that
# then had to follow was refused "Content already exists in this project". The timing spike of
# `board-copy-speed-2026-10-18` (report `board-copy-speed-2026-10-18-spike-copy-timing-report`,
# its `probes` scenario) found why: GitHub files the issue on the board *after* answering the
# create, and a read of the issue's `projectItems` three seconds later found it there. A copy
# therefore files a created issue by this input and reads its board item afterwards, and never
# adds it again. `parentIssueId` below was put to the same probe and answered with the parent.
#
# `Repository.databaseId: Int` — "Identifies the primary key from the database." — was read from
# the same artifact on 2026-10-20: the numeric id an image upload names, read beside the node id
# a create needs so a copy carrying an image sends no `GET /repos/{owner}/{repo}`.
#
# `AddCommentInput.subjectId` is declared there as `ID!` with
# `@possibleTypes(concreteTypes: ["Issue", "PullRequest"], abstractType: "IssueOrPullRequest")`
# (same artifact, same day): GitHub refuses a draft as a subject, and accepts any issue — a
# project's, a document's, one on no board — so a comment's target is still read first.
#
# `deleteProjectV2Field(input: DeleteProjectV2FieldInput!): DeleteProjectV2FieldPayload`, that
# input's `fieldId: ID!` and that payload's `projectV2Field: ProjectV2FieldConfiguration`, and
# `totalCount: Int!` on `ProjectV2FieldConfigurationConnection` and `ProjectV2ItemConnection`,
# were read from GitHub.com's own published schema artifact
# <https://docs.github.com/public/fpt/schema.docs.graphql> on 2026-10-25, reduced to those
# members. Neither the plugin nor any production path sends them: they are the live lane's board
# pre-flight and the scheduled janitor's, which remove a board field a finished CI run left, and
# the janitor's `tests/schema.rs` holds both to this pin.
schema {
  query: Query
  mutation: Mutation
}
scalar String
scalar ID
scalar Int
scalar Boolean

type Query {
  repositoryOwner(login: String!): RepositoryOwner
  repository(owner: String!, name: String!, followRenames: Boolean = true): Repository
  node(id: ID!): Node
  search(query: String!, type: SearchType!, first: Int, after: String): SearchResultItemConnection!
}
enum SearchType {
  ISSUE
  REPOSITORY
  USER
  DISCUSSION
}
type SearchResultItemConnection {
  issueCount: Int!
  nodes: [SearchResultItem]
  pageInfo: PageInfo!
}
union SearchResultItem = Issue | PullRequest
type Mutation {
  createIssue(input: CreateIssueInput!): CreateIssuePayload
  addProjectV2ItemById(input: AddProjectV2ItemByIdInput!): AddProjectV2ItemByIdPayload
  updateIssue(input: UpdateIssueInput!): UpdateIssuePayload
  updateProjectV2DraftIssue(
    input: UpdateProjectV2DraftIssueInput!
  ): UpdateProjectV2DraftIssuePayload
  updateProjectV2ItemFieldValue(
    input: UpdateProjectV2ItemFieldValueInput!
  ): UpdateProjectV2ItemFieldValuePayload
  updateProjectV2Field(input: UpdateProjectV2FieldInput!): UpdateProjectV2FieldPayload
  createProjectV2Field(input: CreateProjectV2FieldInput!): CreateProjectV2FieldPayload
  clearProjectV2ItemFieldValue(
    input: ClearProjectV2ItemFieldValueInput!
  ): ClearProjectV2ItemFieldValuePayload
  addSubIssue(input: AddSubIssueInput!): AddSubIssuePayload
  removeSubIssue(input: RemoveSubIssueInput!): RemoveSubIssuePayload
  addBlockedBy(input: AddBlockedByInput!): AddBlockedByPayload
  removeBlockedBy(input: RemoveBlockedByInput!): RemoveBlockedByPayload
  deleteIssue(input: DeleteIssueInput!): DeleteIssuePayload
  deleteProjectV2Item(input: DeleteProjectV2ItemInput!): DeleteProjectV2ItemPayload
  deleteProjectV2Field(input: DeleteProjectV2FieldInput!): DeleteProjectV2FieldPayload
  addComment(input: AddCommentInput!): AddCommentPayload
  updateIssueComment(input: UpdateIssueCommentInput!): UpdateIssueCommentPayload
  deleteIssueComment(input: DeleteIssueCommentInput!): DeleteIssueCommentPayload
}
input DeleteIssueInput {
  issueId: ID!
}
input DeleteProjectV2ItemInput {
  projectId: ID!
  itemId: ID!
}
type DeleteProjectV2ItemPayload {
  deletedItemId: ID
}
input DeleteProjectV2FieldInput {
  fieldId: ID!
}
type DeleteProjectV2FieldPayload {
  projectV2Field: ProjectV2FieldConfiguration
}
input AddCommentInput {
  subjectId: ID!
  body: String!
  clientMutationId: String
}
input UpdateIssueCommentInput {
  id: ID!
  body: String!
  clientMutationId: String
}
input DeleteIssueCommentInput {
  id: ID!
  clientMutationId: String
}
type AddCommentPayload {
  clientMutationId: String
  commentEdge: IssueCommentEdge
  subject: Node
}
type UpdateIssueCommentPayload {
  clientMutationId: String
  issueComment: IssueComment
}
type DeleteIssueCommentPayload {
  clientMutationId: String
}
input CreateIssueInput {
  repositoryId: ID!
  title: String!
  body: String
  labelIds: [ID!]
  parentIssueId: ID
  projectV2Ids: [ID!]
}
input AddProjectV2ItemByIdInput {
  projectId: ID!
  contentId: ID!
}
input UpdateIssueInput {
  id: ID!
  title: String
  body: String
  state: IssueState
  stateInput: IssueStateUpdateInput
}
input IssueStateUpdateInput {
  value: IssueState!
  stateReason: IssueClosedStateReason
  duplicateIssueId: ID
}
input UpdateProjectV2DraftIssueInput {
  draftIssueId: ID!
  title: String
  body: String
}
input UpdateProjectV2ItemFieldValueInput {
  projectId: ID!
  itemId: ID!
  fieldId: ID!
  value: ProjectV2FieldValue!
}
input ProjectV2FieldValue {
  text: String
  singleSelectOptionId: String
}
input UpdateProjectV2FieldInput {
  projectId: ID!
  fieldId: ID!
  singleSelectOptions: [ProjectV2SingleSelectFieldOptionInput!]
}
input CreateProjectV2FieldInput {
  projectId: ID!
  dataType: ProjectV2CustomFieldType!
  name: String!
  singleSelectOptions: [ProjectV2SingleSelectFieldOptionInput!]
}
enum ProjectV2CustomFieldType {
  DATE
  ITERATION
  NUMBER
  SINGLE_SELECT
  TEXT
}
input ClearProjectV2ItemFieldValueInput {
  projectId: ID!
  itemId: ID!
  fieldId: ID!
}
input ProjectV2SingleSelectFieldOptionInput {
  id: ID
  name: String!
  color: ProjectV2SingleSelectFieldOptionColor!
  description: String!
}
enum ProjectV2SingleSelectFieldOptionColor {
  GRAY
  BLUE
  GREEN
  YELLOW
  PURPLE
  RED
  ORANGE
  PINK
}
input AddSubIssueInput {
  issueId: ID!
  subIssueId: ID
  replaceParent: Boolean
}
input RemoveSubIssueInput {
  issueId: ID!
  subIssueId: ID!
}
input AddBlockedByInput {
  issueId: ID!
  blockingIssueId: ID!
}
input RemoveBlockedByInput {
  issueId: ID!
  blockingIssueId: ID!
}
type CreateIssuePayload {
  issue: Issue
}
type AddProjectV2ItemByIdPayload {
  item: ProjectV2Item
}
type UpdateIssuePayload {
  issue: Issue
}
type UpdateProjectV2DraftIssuePayload {
  draftIssue: DraftIssue
}
type UpdateProjectV2ItemFieldValuePayload {
  projectV2Item: ProjectV2Item
}
type UpdateProjectV2FieldPayload {
  projectV2Field: ProjectV2FieldConfiguration
}
type CreateProjectV2FieldPayload {
  projectV2Field: ProjectV2FieldConfiguration
}
type ClearProjectV2ItemFieldValuePayload {
  projectV2Item: ProjectV2Item
}
type AddSubIssuePayload {
  issue: Issue
  subIssue: Issue
}
type RemoveSubIssuePayload {
  issue: Issue
  subIssue: Issue
}
type AddBlockedByPayload {
  issue: Issue
  blockingIssue: Issue
}
type RemoveBlockedByPayload {
  issue: Issue
  blockingIssue: Issue
}
type DeleteIssuePayload {
  repository: Repository
}
interface Node {
  id: ID!
}
interface RepositoryOwner {
  id: ID!
}
interface ProjectV2Owner {
  projectV2(number: Int!): ProjectV2
}
type Organization implements Node & RepositoryOwner & ProjectV2Owner {
  id: ID!
  projectV2(number: Int!): ProjectV2
}
type User implements Node & RepositoryOwner & ProjectV2Owner {
  id: ID!
  projectV2(number: Int!): ProjectV2
}

type ProjectV2 implements Node {
  id: ID!
  number: Int!
  "Returns true if the project is public."
  public: Boolean!
  title: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  fields(first: Int, after: String): ProjectV2FieldConfigurationConnection!
  items(
    first: Int
    after: String
    "Search query for filtering items"
    query: String
  ): ProjectV2ItemConnection!
}
type ProjectV2FieldConfigurationConnection {
  nodes: [ProjectV2FieldConfiguration]
  pageInfo: PageInfo!
  totalCount: Int!
}
type ProjectV2Item implements Node {
  id: ID!
  updatedAt: DateTime!
  project: ProjectV2!
  fieldValues(first: Int, after: String): ProjectV2ItemFieldValueConnection!
  fieldValueByName(name: String!): ProjectV2ItemFieldValue
  content: ProjectV2ItemContent
}
union ProjectV2ItemContent = DraftIssue | Issue | PullRequest | RedactedProjectV2Item
union ProjectV2ItemFieldValue =
  | ProjectV2ItemFieldLabelValue
  | ProjectV2ItemFieldSingleSelectValue
  | ProjectV2ItemFieldTextValue
union ProjectV2FieldConfiguration = ProjectV2SingleSelectField | ProjectV2Field

type ProjectV2ItemFieldValueConnection {
  nodes: [ProjectV2ItemFieldValue]
  pageInfo: PageInfo!
}
type ProjectV2ItemFieldSingleSelectValue {
  name: String
  optionId: String
  field: ProjectV2FieldConfiguration!
}
type ProjectV2ItemFieldLabelValue {
  labels(first: Int, after: String): LabelConnection!
}
type ProjectV2ItemFieldTextValue {
  text: String
  field: ProjectV2FieldConfiguration!
}
type ProjectV2SingleSelectField {
  id: ID!
  name: String!
  options: [ProjectV2SingleSelectFieldOption!]!
}
type ProjectV2Field {
  id: ID!
  name: String!
  dataType: ProjectV2FieldType!
}
enum ProjectV2FieldType {
  TEXT
}
type ProjectV2SingleSelectFieldOption {
  id: ID!
  name: String!
  color: ProjectV2SingleSelectFieldOptionColor!
  description: String
}

type Issue implements Node {
  id: ID!
  number: Int!
  title: String!
  body: String!
  url: URI!
  createdAt: DateTime!
  updatedAt: DateTime!
  state: IssueState!
  stateReason(enableDuplicate: Boolean = false): IssueStateReason
  repository: Repository!
  parent: Issue
  subIssues(first: Int, after: String): IssueConnection!
  subIssuesSummary: SubIssuesSummary!
  projectItems(first: Int, after: String, includeArchived: Boolean = true): ProjectV2ItemConnection!
  labels(first: Int, after: String): LabelConnection
  blockedBy(first: Int, after: String): IssueConnection!
  blocking(first: Int, after: String): IssueConnection!
  comments(first: Int, after: String, orderBy: IssueCommentOrder): IssueCommentConnection!
  timelineItems(
    since: DateTime
    skip: Int
    itemTypes: [IssueTimelineItemsItemType!]
    after: String
    before: String
    first: Int
    last: Int
  ): IssueTimelineItemsConnection!
}
enum IssueTimelineItemsItemType {
  BLOCKED_BY_ADDED_EVENT
  BLOCKED_BY_REMOVED_EVENT
  BLOCKING_ADDED_EVENT
  BLOCKING_REMOVED_EVENT
  PARENT_ISSUE_ADDED_EVENT
  PARENT_ISSUE_REMOVED_EVENT
}
type IssueTimelineItemsConnection {
  totalCount: Int!
}
interface Actor {
  login: String!
}
type IssueComment implements Node {
  id: ID!
  author: Actor
  body: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  url: URI!
  issue: Issue!
}
type IssueCommentConnection {
  totalCount: Int!
  nodes: [IssueComment]
  pageInfo: PageInfo!
}
type IssueCommentEdge {
  cursor: String!
  node: IssueComment
}
input IssueCommentOrder {
  direction: OrderDirection!
  field: IssueCommentOrderField!
}
enum IssueCommentOrderField {
  UPDATED_AT
}
enum OrderDirection {
  ASC
  DESC
}
type SubIssuesSummary {
  total: Int!
  completed: Int!
  percentCompleted: Int!
}
type PullRequest implements Node {
  id: ID!
  title: String!
  body: String!
  url: URI!
  createdAt: DateTime!
  updatedAt: DateTime!
  state: PullRequestState!
  repository: Repository!
  labels(first: Int, after: String): LabelConnection
}
type Repository implements Node {
  id: ID!
  databaseId: Int
  nameWithOwner: String!
  "Returns a single issue from the current repository by number."
  issue(number: Int!): Issue
}
type DraftIssue implements Node {
  id: ID!
  title: String!
  body: String
  createdAt: DateTime!
  updatedAt: DateTime!
  projectV2Items(first: Int, after: String): ProjectV2ItemConnection!
}
type RedactedProjectV2Item implements Node {
  id: ID!
}
type Label implements Node {
  id: ID!
  name: String!
  color: String!
}
type ProjectV2ItemConnection {
  nodes: [ProjectV2Item!]
  pageInfo: PageInfo!
  totalCount: Int!
}
type IssueConnection {
  nodes: [Issue]
  pageInfo: PageInfo!
}
type LabelConnection {
  nodes: [Label]
  pageInfo: PageInfo!
}
type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}
enum IssueState {
  OPEN
  CLOSED
}
enum IssueStateReason {
  COMPLETED
  DUPLICATE
  NOT_PLANNED
  REOPENED
}
enum IssueClosedStateReason {
  COMPLETED
  DUPLICATE
  NOT_PLANNED
}
enum PullRequestState {
  OPEN
  CLOSED
  MERGED
}
scalar DateTime
scalar URI
