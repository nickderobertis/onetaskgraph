[package]
name = "onetaskgraph-github-projects-e2e"
description = "The GitHub Projects plugin's journeys, driven through the compiled onetaskgraph binary."
# Test-only and never published: it holds nothing but `tests/`, which spawn the binary
# `onetaskgraph:build` made.
# Inherited, never a literal: nothing publishes it, so no release reads a number here, and a
# branch cut before a release cannot land it at the version that release moved past.
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Every dependency is a dev-dependency: the package has no library or binary of its own.
[dev-dependencies]
onetaskgraph-e2e-support.workspace = true
# The documents and the request accounting the loopback board is asserted against, read from
# the plugin's own constants rather than from a copy a journey could drift from.
onetaskgraph-github-projects.workspace = true
serde_json.workspace = true
# What `tests/github_schema/mod.rs`, included from the plugin's tests, parses GitHub's schema
# and a request with.
graphql-parser.workspace = true
onetaskgraph-plugin-api.workspace = true
onebudgetspec-core.workspace = true
regex.workspace = true
tokio.workspace = true
# Its `github-projects` feature, so a Rust caller of the engine builds the loopback board
# from the same configuration document the binary reads.
onetaskgraph-core = { workspace = true, features = ["github-projects"] }
onetaskgraph-local-md.workspace = true
onetaskgraph-live.workspace = true
onetaskgraph-github-live.workspace = true
secrecy.workspace = true
reqwest.workspace = true
chrono.workspace = true
sha2.workspace = true

# The CPU time `store_startup` reads for each child it waited for, from `getrusage`.
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
