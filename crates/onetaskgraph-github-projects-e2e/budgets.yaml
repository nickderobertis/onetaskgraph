schema_version: 1
budgets:
  - id: github-asset-requests-per-new-asset
    description: >-
      An inner measure of headroom on a shared board token that no check may reach: the extra upload and authenticated verification requests per new image, excluding the one repository-id read per source instance. It protects room for other managers sharing that token.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_new", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 2
  - id: github-asset-requests-per-unchanged-asset
    description: >-
      An inner measure of headroom on a shared board token that no check may reach: the extra requests per unchanged image across three re-copies. It protects reuse from spending the shared allowance again.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_unchanged", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 0
  - id: github-asset-copy-seconds
    description: >-
      An inner measure of wall time a person waits on the real board for a project copy followed by one copy per document, measured in simulated time against a loopback modelling GitHub latency and limits. The real board limiter and token may not be spent by a check, and simulation makes the measurement cost no gate time.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_single", "--exact", "--nocapture"]
    unit: seconds
    direction: max
    threshold: 90
  - id: github-concurrent-copies-refused
    description: >-
      An inner measure of refusals while people copy a project then each of its documents onto the real board, measured in simulated time against a loopback modelling GitHub latency and limits. The real board limiter and token may not be spent by a check, and simulation makes the measurement cost no gate time.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_concurrent_refusals", "--exact", "--nocapture"]
    unit: copies
    direction: max
    threshold: 0
  - id: github-concurrent-copy-seconds
    description: >-
      An inner measure of the slowest wall time a person waits on the real board for a project copy followed by one copy per document, measured in simulated time against a loopback modelling GitHub latency and limits. The real board limiter and token may not be spent by a check, and simulation makes the measurement cost no gate time.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_concurrent", "--exact", "--nocapture"]
    unit: seconds
    direction: max
    threshold: 240
  - id: visibility-write-requests
    description: >-
      An inner measure of headroom on a shared board token that no check may reach: the GitHub requests one copy of a 100-task plan with its project and design document (102 writes) spends learning the visibility of the board's Project and of each issue's repository, preflights included, onto a board declared private, so every write is checked against live visibility. The detail breaks it down per write, by write kind and by read kind, and adds the simulated seconds those reads add at 0.38 s each with a write's two overlapping, as telemetry with no threshold of its own.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_visibility_reads", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 204
