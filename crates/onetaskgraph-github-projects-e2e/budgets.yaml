    threshold: 8
  - id: github-plan-copy-seconds-first
    description: >-
      The simulated seconds, each request held for the timing spike's mean for its kind, of a first copy of the generated 10-item plan (a 50 KB project, eight 45-49 KB tasks with 10 edges, 19 field values, a 35 KB document with a 104 KB PNG), one `project copy` then one `document copy`, the larger of three recordings on a 2,000-item loopback board and again on a 20,000-item one — with no write policy, screened through the released onevcs boundary commands, and in the host's configuration (the plan's source declared `visibility: private`, the board's `cache: {enabled: true}`, screening on). It protects the time the manager and the user wait for every plan filed onto the plans board.
    labels: [github]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects a report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with; the task registering the seven plan-copy budgets names this one generic entry for all of them. It reads only the telemetry `plan_copy.rs` recorded during the crate's test run, refuses a recording of another plan, board or scenario, and hands the figure to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_plan_copy", "--exact", "--nocapture"]
    unit: seconds
    direction: max
    threshold: 32
  # Labelled `host`: wall-clock time on the machine that runs it, which the host's load moves,
  # so only the uncached `budgets-host` target checks it and no per-change target does.
  - id: github-plan-copy-real-seconds-unchanged
    description: >-
      The real seconds the two processes of an unchanged re-copy of the generated 10-item plan ran on a 2,000-item loopback board, beside the simulated seconds its gated budget holds. It protects the copy's own work on the machine that runs it from growing unseen.
    labels: [github, host]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects a report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with; every plan-copy budget, its host-labelled real-time figures included, names this one generic entry. It reads only the telemetry `plan_copy.rs` recorded during the crate's test run, refuses a recording of another plan, board or scenario, and hands the figure to onebudgetspec, which alone judges it.
