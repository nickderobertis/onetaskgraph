schema_version: 1
budgets:
  - id: github-asset-requests-per-new-asset
    description: >-
      An inner measure of headroom on a shared board token that no check may reach: the extra upload and authenticated verification requests per new image, excluding the one repository-id read per source instance. It protects room for other managers sharing that token.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_new", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 2
  - id: github-asset-requests-per-unchanged-asset
    description: >-
      An inner measure of headroom on a shared board token that no check may reach: the extra requests per unchanged image across three re-copies. It protects reuse from spending the shared allowance again.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_unchanged", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 0
  - id: github-asset-copy-seconds
    description: >-
      An inner measure of wall time a person waits on the real board for a project copy followed by one copy per document, measured in simulated time against a loopback modelling GitHub latency and limits. The real board limiter and token may not be spent by a check, and simulation makes the measurement cost no gate time.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_single", "--exact", "--nocapture"]
    unit: seconds
    direction: max
    threshold: 90
  - id: github-concurrent-copies-refused
    description: >-
      An inner measure of refusals while people copy a project then each of its documents onto the real board, measured in simulated time against a loopback modelling GitHub latency and limits. The real board limiter and token may not be spent by a check, and simulation makes the measurement cost no gate time.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_concurrent_refusals", "--exact", "--nocapture"]
    unit: copies
    direction: max
    threshold: 0
  - id: github-concurrent-copy-seconds
    description: >-
      An inner measure of the slowest wall time a person waits on the real board for a project copy followed by one copy per document, measured in simulated time against a loopback modelling GitHub latency and limits. The real board limiter and token may not be spent by a check, and simulation makes the measurement cost no gate time.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_concurrent", "--exact", "--nocapture"]
    unit: seconds
    direction: max
    threshold: 240
  - id: github-metadata-field-content-creation-share
    description: >-
      An inner measure of headroom on the shared board token that no check may spend: the larger share of GitHub's per-minute and hourly content-creation allowances that projecting one metadata field adds to a 10x hour of follow-up filing, every aliased mutation counted as one write. It protects the write allowance every manager on the host draws from.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_metadata_fields", "--exact", "--nocapture"]
    unit: percent
    direction: max
    threshold: 12.5
  - id: visibility-write-requests
    description: >-
      An inner measure of headroom on a shared board token that no check may reach: the requests a 102-write plan copy onto a board declared private spends reading the board's and each issue repository's visibility. It protects that token's allowance from a third read per write.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_visibility_reads", "--exact", "--nocapture"]
    unit: requests
    direction: max
    threshold: 204
  - id: github-landing-closure-points
    description: >-
      An inner measure of the shared board token that no check may spend: the GitHub GraphQL points one `task status complete` call naming no source spends for one landing closing 10 open issues held on a board of 11,000 items, with a second configured board of 1,100 items holding none of them, driven through the binary against two loopback boards and priced with the plugin's own table; the 1x figure and each source's reads and writes at both scales are its detail. It protects every manager's share of that token from a landing's closure write.
    labels: [github]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects its own report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with (report_visibility_reads, report_metadata_fields); this one follows it, and its task names that pattern. The entry reads only the telemetry the `status_complete` journey recorded and hands it to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_landing_closure", "--exact", "--nocapture"]
    unit: points
    direction: max
    threshold: 25
  - id: github-cache-points-not-above-uncached
    description: >-
      An inner measure of the shared board token that no check may spend: the largest difference, cache on minus cache off, in GitHub GraphQL points over every kind (tasks, projects, documents, manifests, asset bytes), sequence (cold, unchanged pinned reread by two concurrent passes, list-then-load after edits, write-then-read; for asset bytes, which only a render reads, a cold render, an unchanged render, a render after edits and a render after a render) and scale (20 projects, 100 documents, 80 tasks and 8 images, and ten times that), and each scale's total, driven through the binary against a loopback board and priced with the plugin's own table. It protects every manager's share of that token from quota the cache adds; the stale-option fallback is recorded beside it and kept out.
    labels: [github]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects its own report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with (report_visibility_reads, report_metadata_fields); this one follows it, and its task names that pattern. The entry reads only the telemetry the journeys recorded and hands it to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_cache_points", "--exact", "--nocapture"]
    unit: points
    direction: max
    threshold: 0
  - id: github-live-session-points
    description: >-
      Whole credentialed GitHub lane primary points, attributed from complete current telemetry with explicit modelled prices, protecting shared-account headroom.
    labels: [github, live-session]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] This task fixes the report-only report_live_session command: it reads current main/assets telemetry and uses the existing SDK; onebudgetspec alone judges the threshold.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_live_session", "--exact", "--nocapture"]
    unit: points
    direction: max
    threshold: 299
  - id: github-plan-copy-seconds-unchanged
    description: >-
      The simulated seconds, each request held for the timing spike's mean for its kind, of an unchanged re-copy of the generated 10-item plan (a 50 KB project, eight 45-49 KB tasks with 10 edges, 19 field values, a 35 KB document with a 104 KB PNG) on a 2,000-item loopback board, one `project copy` then one `document copy`, holding no change token or cache entry. It protects the time the manager and the user wait for every plan revision filed onto the plans board.
    labels: [github]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects a report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with; the task registering the seven plan-copy budgets names this one generic entry for all of them. It reads only the telemetry `plan_copy.rs` recorded during the crate's test run, refuses a recording of another plan, board or scenario, and hands the figure to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_plan_copy", "--exact", "--nocapture"]
    unit: seconds
    direction: max
    threshold: 7
  - id: github-plan-copy-seconds-changed
    description: >-
      The simulated seconds, each request held for the timing spike's mean for its kind, of a re-copy of the generated 10-item plan (a 50 KB project, eight 45-49 KB tasks with 10 edges, 19 field values, a 35 KB document with a 104 KB PNG) on a 2,000-item loopback board, one `project copy` then one `document copy` after one task's body changed, holding no change token or cache entry. It protects the time the manager and the user wait for every plan revision filed onto the plans board.
    labels: [github]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects a report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with; the task registering the seven plan-copy budgets names this one generic entry for all of them. It reads only the telemetry `plan_copy.rs` recorded during the crate's test run, refuses a recording of another plan, board or scenario, and hands the figure to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_plan_copy", "--exact", "--nocapture"]
    unit: seconds
    direction: max
    threshold: 8
  - id: github-plan-copy-seconds-first
    description: >-
      The simulated seconds, each request held for the timing spike's mean for its kind, of a first copy of the generated 10-item plan (a 50 KB project, eight 45-49 KB tasks with 10 edges, 19 field values, a 35 KB document with a 104 KB PNG) on a 2,000-item loopback board, one `project copy` then one `document copy`. It protects the time the manager and the user wait for every plan filed onto the plans board.
    labels: [github]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects a report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with; the task registering the seven plan-copy budgets names this one generic entry for all of them. It reads only the telemetry `plan_copy.rs` recorded during the crate's test run, refuses a recording of another plan, board or scenario, and hands the figure to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_plan_copy", "--exact", "--nocapture"]
    unit: seconds
    direction: max
    threshold: 32
  # Labelled `host`: wall-clock time on the machine that runs it, which the host's load moves,
  # so only the uncached `budgets-host` target checks it and no per-change target does.
  - id: github-plan-copy-real-seconds-unchanged
    description: >-
      The real seconds the two processes of an unchanged re-copy of the generated 10-item plan ran on a 2,000-item loopback board, beside the simulated seconds its gated budget holds. It protects the copy's own work on the machine that runs it from growing unseen.
    labels: [github, host]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects a report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with; every plan-copy budget, its host-labelled real-time figures included, names this one generic entry. It reads only the telemetry `plan_copy.rs` recorded during the crate's test run, refuses a recording of another plan, board or scenario, and hands the figure to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_plan_copy", "--exact", "--nocapture"]
    unit: seconds
    direction: max
    threshold: 3
  # Labelled `host`: wall-clock time on the machine that runs it, which the host's load moves,
  # so only the uncached `budgets-host` target checks it and no per-change target does.
  - id: github-plan-copy-real-seconds-changed
    description: >-
      The real seconds the two processes of a re-copy after one task's body changed of the generated 10-item plan ran on a 2,000-item loopback board, beside the simulated seconds its gated budget holds. It protects the copy's own work on the machine that runs it from growing unseen.
    labels: [github, host]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects a report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with; every plan-copy budget, its host-labelled real-time figures included, names this one generic entry. It reads only the telemetry `plan_copy.rs` recorded during the crate's test run, refuses a recording of another plan, board or scenario, and hands the figure to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_plan_copy", "--exact", "--nocapture"]
    unit: seconds
    direction: max
    threshold: 3
  # Labelled `host`: wall-clock time on the machine that runs it, which the host's load moves,
  # so only the uncached `budgets-host` target checks it and no per-change target does.
  - id: github-plan-copy-real-seconds-first
    description: >-
      The real seconds the two processes of a first copy of the generated 10-item plan ran on a 2,000-item loopback board, beside the simulated seconds its gated budget holds. It protects the copy's own work on the machine that runs it from growing unseen.
    labels: [github, host]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects a report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with; every plan-copy budget, its host-labelled real-time figures included, names this one generic entry. It reads only the telemetry `plan_copy.rs` recorded during the crate's test run, refuses a recording of another plan, board or scenario, and hands the figure to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_plan_copy", "--exact", "--nocapture"]
    unit: seconds
    direction: max
    threshold: 3
  - id: github-plan-copy-points-unchanged
    description: >-
      An inner measure of the shared board token that no check may spend: the GraphQL primary points an unchanged re-copy of the generated 10-item plan (a 50 KB project, eight 45-49 KB tasks with 10 edges, 19 field values, a 35 KB document with a 104 KB PNG) on a 2,000-item loopback board, one `project copy` then one `document copy` spends, holding no change token or cache entry for its items, priced as the timing spike's pricing.json — a board page 2, an issue-search page 5, any other read 1, each mutation request 1, REST 0. It protects every manager's share of that token from a re-copy that changes nothing.
    labels: [github]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects a report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with; the task registering the seven plan-copy budgets names this one generic entry for all of them. It reads only the telemetry `plan_copy.rs` recorded during the crate's test run, refuses a recording of another plan, board or scenario, and hands the figure to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_plan_copy", "--exact", "--nocapture"]
    unit: points
    direction: max
    threshold: 3
  - id: github-plan-copy-points-changed
    description: >-
      An inner measure of the shared board token that no check may spend: the GraphQL primary points a re-copy of the generated 10-item plan (a 50 KB project, eight 45-49 KB tasks with 10 edges, 19 field values, a 35 KB document with a 104 KB PNG) on a 2,000-item loopback board, one `project copy` then one `document copy` spends after one task's body changed, holding no change token or cache entry for its items, priced as the timing spike's pricing.json — a board page 2, an issue-search page 5, any other read 1, each mutation request 1, REST 0. It protects every manager's share of that token from the re-copies a plan's revisions make.
    labels: [github]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects a report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with; the task registering the seven plan-copy budgets names this one generic entry for all of them. It reads only the telemetry `plan_copy.rs` recorded during the crate's test run, refuses a recording of another plan, board or scenario, and hands the figure to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_plan_copy", "--exact", "--nocapture"]
    unit: points
    direction: max
    threshold: 4
  - id: github-plan-copy-points-first
    description: >-
      An inner measure of the shared board token that no check may spend: the GraphQL primary points a first copy of the generated 10-item plan (a 50 KB project, eight 45-49 KB tasks with 10 edges, 19 field values, a 35 KB document with a 104 KB PNG) on a 2,000-item loopback board, one `project copy` then one `document copy` spends, priced as the timing spike's pricing.json — a board page 2, an issue-search page 5, any other read 1, each mutation request 1, REST 0. It protects every manager's share of that token from filing a plan.
    labels: [github]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects a report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with; the task registering the seven plan-copy budgets names this one generic entry for all of them. It reads only the telemetry `plan_copy.rs` recorded during the crate's test run, refuses a recording of another plan, board or scenario, and hands the figure to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_plan_copy", "--exact", "--nocapture"]
    unit: points
    direction: max
    threshold: 12
  - id: github-plan-copy-content-creations
    description: >-
      An inner measure of the write allowance every manager on the board token shares: the writes GitHub's secondary limit may count against its 80-a-minute and 500-an-hour allowances in a first copy of the generated 10-item plan (a 50 KB project, eight 45-49 KB tasks with 10 edges, 19 field values, a 35 KB document with a 104 KB PNG) on a 2,000-item loopback board, one `project copy` then one `document copy` — every mutation, each aliased mutation and each field value of an aliased field update counted one, since whether GitHub counts an aliased request once could not be established, plus each upload. It protects that shared allowance from filing a plan.
    labels: [github]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects a report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with; the task registering the seven plan-copy budgets names this one generic entry for all of them. It reads only the telemetry `plan_copy.rs` recorded during the crate's test run, refuses a recording of another plan, board or scenario, and hands the figure to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_plan_copy", "--exact", "--nocapture"]
    unit: writes
    direction: max
    threshold: 40
