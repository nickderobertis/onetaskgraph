# Each command names what it reads as its last argument, a libtest filter no test matches or an
# argument its script ignores: its saved telemetry, or for the two sanitize sweeps, which measure
# afresh, the binary they spawn. A job with no build then reads the row as unavailable.
schema_version: 1
budgets:
  - id: github-asset-requests-per-new-asset
    description: >-
      An inner measure of headroom on a shared board token that no check may reach: the extra upload and authenticated verification requests per new image, excluding the one repository-id read per source instance. It protects room for other managers sharing that token.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_new", "--exact", "--nocapture", "../../target/debug/telemetry/onetaskgraph-github-projects-e2e"]
    unit: requests
    direction: max
    threshold: 2
  - id: github-asset-requests-per-unchanged-asset
    description: >-
      An inner measure of headroom on a shared board token that no check may reach: the extra requests per unchanged image across three re-copies. It protects reuse from spending the shared allowance again.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_unchanged", "--exact", "--nocapture", "../../target/debug/telemetry/onetaskgraph-github-projects-e2e"]
    unit: requests
    direction: max
    threshold: 0
  - id: github-asset-copy-seconds
    description: >-
      An inner measure of wall time a person waits on the real board for a project copy followed by one copy per document, measured in simulated time against a loopback modelling GitHub latency and limits. The real board limiter and token may not be spent by a check, and simulation makes the measurement cost no gate time.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_single", "--exact", "--nocapture", "../../target/debug/telemetry/onetaskgraph-github-projects-e2e"]
    unit: seconds
    direction: max
    threshold: 90
  - id: github-concurrent-copies-refused
    description: >-
      An inner measure of refusals while people copy a project then each of its documents onto the real board, measured in simulated time against a loopback modelling GitHub latency and limits. The real board limiter and token may not be spent by a check, and simulation makes the measurement cost no gate time.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_concurrent_refusals", "--exact", "--nocapture", "../../target/debug/telemetry/onetaskgraph-github-projects-e2e"]
    unit: copies
    direction: max
    threshold: 0
  - id: github-concurrent-copy-seconds
    description: >-
      An inner measure of the slowest wall time a person waits on the real board for a project copy followed by one copy per document, measured in simulated time against a loopback modelling GitHub latency and limits. The real board limiter and token may not be spent by a check, and simulation makes the measurement cost no gate time.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_concurrent", "--exact", "--nocapture", "../../target/debug/telemetry/onetaskgraph-github-projects-e2e"]
    unit: seconds
    direction: max
    threshold: 240
  - id: github-metadata-field-content-creation-share
    description: >-
      An inner measure of headroom on the shared board token that no check may spend: the larger share of GitHub's per-minute and hourly content-creation allowances that projecting one metadata field adds to a 10x hour of follow-up filing, every aliased mutation counted as one write. It protects the write allowance every manager on the host draws from.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_metadata_fields", "--exact", "--nocapture", "../../target/debug/telemetry/onetaskgraph-github-projects-e2e"]
    unit: percent
    direction: max
    threshold: 12.5
  # llmlint: ignore[budgets_track_product_owner_outcomes] The user's ruling 7 makes the read-once rule this task's own budget at threshold 1. Its figure is not part of any other budget's figure: the plan-copy points budgets record copies onto a public board, which reads no visibility, and they price REST at 0.
  - id: visibility-reads-per-destination
    description: >-
      The most visibility reads any one destination receives within either command of a mixed plan's first project copy (101 private-board writes) followed by its document copy (1 write), with public task views on a public board. It protects the shared board token from a visibility read per write by requiring each command to share its reads across writes.
    labels: [github]
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_visibility_reads", "--exact", "--nocapture", "../../target/debug/telemetry/onetaskgraph-github-projects-e2e"]
    unit: reads
    direction: max
    threshold: 1
  - id: github-landing-closure-points
    description: >-
      An inner measure of the shared board token that no check may spend: the GitHub GraphQL points one `task status complete` call naming no source spends for one landing closing 10 open issues held on a board of 11,000 items, with a second configured board of 1,100 items holding none of them, driven through the binary against two loopback boards and priced with the plugin's own table; the 1x figure and each source's reads and writes at both scales are its detail. It protects every manager's share of that token from a landing's closure write.
    labels: [github]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects its own report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with (report_visibility_reads, report_metadata_fields); this one follows it, and its task names that pattern. The entry reads only the telemetry the `status_complete` journey recorded and hands it to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_landing_closure", "--exact", "--nocapture", "../../target/debug/telemetry/onetaskgraph-github-projects-e2e"]
    unit: points
    direction: max
    threshold: 25
  - id: github-cache-points-not-above-uncached
    description: >-
      An inner measure of the shared board token that no check may spend: the largest difference, cache on minus cache off, in GitHub GraphQL points over every kind (tasks, projects, documents, manifests, asset bytes), sequence (cold, unchanged pinned reread by two concurrent passes, list-then-load after edits, write-then-read; for asset bytes, which only a render reads, a cold render, an unchanged render, a render after edits and a render after a render) and scale (20 projects, 100 documents, 80 tasks and 8 images, and ten times that), and each scale's total, driven through the binary against a loopback board and priced with the plugin's own table. It protects every manager's share of that token from quota the cache adds; the stale-option fallback is recorded beside it and kept out.
    labels: [github]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] Every budget of this file selects its own report-only entry in `budget_runner`, the harness-runner convention this crate's budgets landed with (report_visibility_reads, report_metadata_fields); this one follows it, and its task names that pattern. The entry reads only the telemetry the journeys recorded and hands it to onebudgetspec, which alone judges it.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_cache_points", "--exact", "--nocapture", "../../target/debug/telemetry/onetaskgraph-github-projects-e2e"]
    unit: points
    direction: max
    threshold: 0
  - id: github-live-session-points
    description: >-
      Whole credentialed GitHub lane primary points, attributed from complete current telemetry with explicit modelled prices, protecting shared-account headroom.
    labels: [github, live-session]
    measure: reported
    # llmlint: ignore[budget_commands_measure_directly] This task fixes the report-only report_live_session command: it reads current main/assets telemetry and uses the existing SDK; onebudgetspec alone judges the threshold.
    command: ["cargo", "test", "--quiet", "-p", "onetaskgraph-github-projects-e2e", "--all-features", "--locked", "--test", "e2e", "--", "budget_runner::report_live_session", "--exact", "--nocapture", "../../target/debug/telemetry/github-live-session"]
    unit: points
    direction: max
    threshold: 299
