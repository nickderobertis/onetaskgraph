[package]
name = "onetaskgraph-e2e-support"
description = "The harness every binary end-to-end suite of this workspace drives the CLI through."
# Not published: the test-only e2e members name it as a path-only dev-dependency, and nothing a
# consumer installs can reach it.
# llmlint: ignore[crates_stay_in_one_cargo_workspace] A literal rather than `version.workspace = true` because that is what every crate manifest of this workspace spells, and because the release tooling reads a number here: `scripts/set-version.sh` writes this line through `scripts/product_versions.py`, and `--check` reads it back and refuses any value but the workspace's — a command of `distribution-check`, which is part of the required `check`. So the two cannot drift, and a crate spelling it the other way would be the one manifest that tooling has to learn an exception for.
version = "0.3.3"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
assert_cmd.workspace = true
chrono.workspace = true
graphql-parser.workspace = true
# The loopback board and workspace answer the documents each hosted plugin declares, read
# from the plugin's own constants rather than from a copy of them a fixture could drift from.
onetaskgraph-github-projects.workspace = true
onetaskgraph-linear.workspace = true
onetaskgraph-plugin-api.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# The simulated clock's coordinator: a handler's hold completes on a `oneshot`.
tokio.workspace = true
