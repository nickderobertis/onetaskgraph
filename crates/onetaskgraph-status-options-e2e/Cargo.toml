[package]
name = "onetaskgraph-status-options-e2e"
description = "The status-options setup's journeys, driven through the compiled onetaskgraph binary."
# Test-only and never published: it holds nothing but `tests/`, which spawn the binary
# `onetaskgraph:build` made. The literal version is the one every crate manifest here spells,
# for the reason crates/onetaskgraph-live/Cargo.toml gives.
version = "0.3.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Every dependency is a dev-dependency: the package has no library or binary of its own.
[dev-dependencies]
onetaskgraph-e2e-support.workspace = true
serde_json.workspace = true
