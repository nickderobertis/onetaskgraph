# This repository's own pool maintenance, declared for onevcs.
#
# onevcs reads this file from this repository's publication checkout on its base branch,
# never from a session's branch, and runs `command` in each idle warm-pool slot's worktree,
# never in a slot a session holds. Without it this repository's slots are never maintained.
#
# The command is the justfile's `pool-maintenance` recipe, which runs the pinned
# cargo-prune-superseded over every cargo target directory this repository builds into
# (`target`, where .cargo/config.toml points every build). In each profile directory it
# removes a unit's superseded builds in deps/, .fingerprint/, build/ and incremental/ last
# modified more than 2 days ago, and keeps each unit's newest build and every build
# modified within those 2 days, so a rebuild in the slot stays warm.
# pool-maintenance/budgets.yaml holds how long one pass takes.
schema_version = 1

[pool.maintain]
command = ["just", "pool-maintenance"]
timeout = "30m"
